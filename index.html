c":"Organ limfoid bilobus di mediastinum anterior atas, di belakang sternum; besar pada anak lalu mengecil dan digantikan lemak setelah pubertas.","fn":"Tempat pematangan sel T dan sumber hormon timosin.","nerve":"N. vagus, trunkus simpatikus, dan cabang kecil n. frenikus.","blood":"A. torakika interna (cabang timus), a. tiroidea inferior; v. timika ke v. brakiosefalika kiri.","rel":"Sternum, perikardium dan arkus aorta, v. brakiosefalika kiri, trakea.","clin":"Timoma (terkait miastenia gravis), sindrom DiGeorge (aplasia timus), hipoplasia timus pada imunodefisiensi."},"atrium_r":{"desc":"Ruang jantung penerima darah dari v. kava superior dan inferior serta sinus koronarius; memiliki aurikula, krista terminalis, dan fossa ovalis.","fn":"Menampung darah kurang oksigen dan mengalirkannya ke ventrikel kanan lewat katup trikuspid; nodus SA (pacu jantung) ada di dindingnya.","nerve":"Pleksus kardiakus (parasimpatis n. vagus X, simpatis T1–T4).","blood":"A. koroner kanan (cabang nodus SA dan atrial); darah vena lewat sinus koronarius.","rel":"V. kava superior dan inferior, ventrikel kanan, atrium kiri (septum interatrial), perikardium.","clin":"Fibrilasi atrium, defek septum atrium (foramen ovale paten), aritmia nodus SA, trombus atrium."},"atrium_l":{"desc":"Ruang berdinding halus di bagian belakang jantung yang menerima empat vena pulmonalis; aurikula kiri berbentuk jari.","fn":"Menerima darah beroksigen dari paru dan mengalirkannya ke ventrikel kiri lewat katup mitral.","nerve":"Pleksus kardiakus (parasimpatis n. vagus X, simpatis T1–T4).","blood":"A. sirkumfleksa (cabang atrial kiri) dan a. koroner kanan; drainase ke sinus koronarius.","rel":"Vena pulmonalis, ventrikel kiri, esofagus (belakang), bronkus utama, aorta asendens.","clin":"Fibrilasi atrium (trombus aurikula kiri, risiko stroke), stenosis mitral, pembesaran menekan esofagus."},"ventricle_r":{"desc":"Ruang berdinding tipis di bagian depan jantung dengan trabekula, otot papilaris, dan infundibulum menuju trunkus pulmonalis.","fn":"Memompa darah kurang oksigen ke paru lewat katup pulmonal (tekanan rendah).","nerve":"Pleksus kardiakus (parasimpatis n. vagus X, simpatis T1–T4). Sistem konduksi: cabang berkas kanan.","blood":"A. koroner kanan (cabang marginal kanan dan interventrikular posterior), a. desendens anterior kiri.","rel":"Atrium kanan, ventrikel kiri (septum interventrikular), trunkus pulmonalis, sternum.","clin":"Gagal jantung kanan (kor pulmonale), infark ventrikel kanan, tetralogi Fallot, defek septum ventrikel."},"ventricle_l":{"desc":"Ruang dengan dinding paling tebal (sekitar 10–15 mm) yang membentuk apeks jantung; trabekula halus dan dua otot papilaris.","fn":"Memompa darah beroksigen ke seluruh tubuh lewat katup aorta (tekanan tinggi).","nerve":"Pleksus kardiakus (parasimpatis n. vagus X, simpatis T1–T4). Berkas His cabang kiri (fasikel anterior dan posterior).","blood":"A. koroner kiri (desendens anterior dan sirkumfleksa), a. koroner kanan (interventrikular posterior).","rel":"Atrium kiri, ventrikel kanan, aorta, perikardium, diafragma, paru kiri.","clin":"Infark miokard, kardiomiopati, hipertrofi ventrikel kiri, gagal jantung kiri, aneurisma ventrikel."},"papillary":{"desc":"Tonjolan otot di dinding ventrikel yang melekat ke daun katup AV lewat korda tendinea.","fn":"Menahan daun katup agar tidak membalik ke atrium saat ventrikel berkontraksi.","nerve":"Serat Purkinje dan pleksus kardiakus.","blood":"A. koroner (desendens anterior, sirkumfleksa, atau interventrikular posterior); otot posteromedial hanya satu sumber.","rel":"Korda tendinea, daun katup trikuspid atau mitral, dinding ventrikel.","clin":"Ruptur otot papilaris pasca infark (regurgitasi mitral akut), prolaps katup mitral."},"tricuspid":{"desc":"Daun katup atrioventrikular kanan (anterior, posterior, septal) yang membentuk katup trikuspid.","fn":"Mencegah aliran balik dari ventrikel kanan ke atrium kanan.","nerve":"Pleksus kardiakus.","blood":"Daun katup avaskular; cincin katup oleh a. koroner kanan.","rel":"Atrium kanan, ventrikel kanan, korda tendinea, otot papilaris.","clin":"Regurgitasi dan stenosis trikuspid, anomali Ebstein, endokarditis (pengguna narkoba suntik)."},"mitral":{"desc":"Daun katup atrioventrikular kiri (anterior dan posterior) yang membentuk katup mitral (bikuspid).","fn":"Mencegah aliran balik dari ventrikel kiri ke atrium kiri.","nerve":"Pleksus kardiakus.","blood":"Daun katup avaskular; cincin katup oleh a. sirkumfleksa.","rel":"Atrium kiri, ventrikel kiri, korda tendinea, otot papilaris, katup aorta.","clin":"Stenosis mitral (penyakit jantung rematik), regurgitasi mitral, prolaps katup mitral, endokarditis."},"aortic_valve":{"desc":"Tiga daun semilunar (koroner kanan, koroner kiri, non-koroner) di pangkal aorta, dengan sinus Valsalva di belakangnya.","fn":"Mencegah aliran balik dari aorta ke ventrikel kiri saat diastol; a. koroner keluar dari sinus Valsalva.","nerve":"Pleksus kardiakus.","blood":"Daun katup avaskular; a. koroner kanan dan kiri berasal dari sinus kanan dan kiri.","rel":"Ventrikel kiri (jalur keluar), aorta asendens, katup mitral, septum interventrikular.","clin":"Stenosis aorta (kalsifikasi, katup bikuspid), regurgitasi aorta, endokarditis, diseksi aorta."},"pulm_valve":{"desc":"Tiga daun semilunar (anterior, kiri, kanan) di pangkal trunkus pulmonalis.","fn":"Mencegah aliran balik dari trunkus pulmonalis ke ventrikel kanan.","nerve":"Pleksus kardiakus.","blood":"Daun katup avaskular; cincin katup oleh cabang a. koroner kanan dan desendens anterior.","rel":"Ventrikel kanan (infundibulum), trunkus pulmonalis, katup aorta.","clin":"Stenosis pulmonal kongenital, regurgitasi pulmonal, tetralogi Fallot."},"rca":{"desc":"Keluar dari sinus aorta kanan, berjalan di sulkus atrioventrikular kanan ke bawah menuju krusis jantung.","fn":"Memasok atrium kanan, ventrikel kanan, nodus SA (sekitar 60%), nodus AV (sekitar 80%), dan septum bagian bawah.","nerve":"Persarafan otonom pleksus kardiakus mengikuti arteri.","blood":"Cabang konus, nodus SA, marginal kanan, dan interventrikular posterior (dominansi kanan sekitar 70–80%).","rel":"Atrium kanan, aurikula kanan, ventrikel kanan, v. jantung kecil, sulkus koronarius.","clin":"Infark inferior (EKG II, III, aVF), blokade AV, infark ventrikel kanan, PCI dan CABG."},"lca":{"desc":"Batang utama a. koroner kiri (left main) sekitar 1–2 cm dari sinus aorta kiri; bercabang menjadi LAD dan sirkumfleksa.","fn":"Memasok sebagian besar ventrikel kiri (sekitar 70% massa otot jantung).","nerve":"Persarafan otonom pleksus kardiakus.","blood":"Cabang: a. desendens anterior kiri dan sirkumfleksa (kadang ramus intermedius).","rel":"Trunkus pulmonalis (depan), aurikula kiri (lateral), sinus aorta kiri.","clin":"Stenosis left main (infark luas berisiko tinggi), CABG."},"lcx":{"desc":"Cabang kiri a. koroner kiri di sulkus atrioventrikular kiri, melingkari sisi kiri jantung.","fn":"Memasok atrium kiri serta dinding lateral dan posterior ventrikel kiri.","nerve":"Persarafan otonom pleksus kardiakus.","blood":"Cabang marginal tumpul dan atrial kiri; nodus SA pada sekitar 40% orang.","rel":"Atrium kiri, sinus koronarius dan v. jantung besar, ventrikel kiri.","clin":"Infark lateral atau posterior (EKG I, aVL, V5–V6); dominansi kiri (sekitar 10%)."},"lad":{"desc":"Cabang anterior a. koroner kiri di sulkus interventrikular anterior menuju apeks.","fn":"Memasok dinding anterior ventrikel kiri, apeks, dan dua pertiga anterior septum interventrikular.","nerve":"Persarafan otonom pleksus kardiakus.","blood":"Cabang diagonal dan septal; beranastomosis dengan a. interventrikular posterior di apeks.","rel":"Ventrikel kanan dan kiri (sulkus), v. jantung besar, trunkus pulmonalis.","clin":"Infark anterior, angina, PCI, CABG (a. torakika interna ke LAD)."},"cor_branch":{"desc":"Cabang arteri koroner: cabang inferolateral kanan (marginal kanan) dari a. koroner kanan dan cabang septal dari LAD.","fn":"Memasok dinding inferolateral ventrikel kanan dan septum interventrikular.","nerve":"Persarafan otonom pleksus kardiakus.","blood":"Cabang a. koroner kanan dan LAD.","rel":"Ventrikel kanan, septum interventrikular, berkas His.","clin":"Infark septum (blokade berkas), infark ventrikel kanan, defek septum ventrikel pasca infark."},"great_cardiac":{"desc":"Vena utama jantung yang naik di sulkus interventrikular anterior lalu melingkar di sulkus AV kiri menuju sinus koronarius.","fn":"Mengalirkan darah vena dari ventrikel dan atrium kiri serta septum anterior.","nerve":"Pleksus kardiakus (vasomotor).","blood":"Bermuara ke sinus koronarius.","rel":"A. desendens anterior (berdampingan), a. sirkumfleksa, atrium dan ventrikel kiri.","clin":"Dipakai untuk elektroda terapi resinkronisasi jantung dan akses kateter."},"coronary_sinus":{"desc":"Vena pendek dan lebar di belakang sulkus AV kiri yang bermuara ke atrium kanan.","fn":"Mengalirkan sekitar 60–70% darah vena jantung ke atrium kanan.","nerve":"Pleksus kardiakus.","blood":"Menerima v. jantung besar, tengah, kecil, dan posterior.","rel":"Atrium kiri (belakang), atrium kanan (muara), a. sirkumfleksa.","clin":"Akses elektroda pacu, kardioplegia retrograd, pelebaran pada hipertensi atrium kanan."},"middle_cardiac":{"desc":"Vena yang berjalan di sulkus interventrikular posterior menuju sinus koronarius.","fn":"Mengalirkan darah vena dari bagian belakang ventrikel dan septum.","nerve":"Pleksus kardiakus.","blood":"Bermuara ke sinus koronarius.","rel":"A. interventrikular posterior, ventrikel kiri dan kanan, apeks.","clin":"Variasi anatomi penting pada pemasangan elektroda dan bedah jantung."},"cor_vein":{"desc":"Vena kecil jantung yang bermuara ke sinus koronarius atau v. jantung besar, termasuk vena posterior dan inferior ventrikel kiri.","fn":"Mengalirkan darah vena dari dinding posterior dan inferior ventrikel kiri.","nerve":"Pleksus kardiakus.","blood":"Bermuara ke sinus koronarius atau v. jantung besar.","rel":"Ventrikel kiri (permukaan diafragmatik), sinus koronarius.","clin":"Target elektroda CRT; variasi anatomi."},"pulm_trunk":{"desc":"Pembuluh dari ventrikel kanan sepanjang sekitar 5 cm yang bercabang menjadi a. pulmonalis kanan dan kiri; ligamentum arteriosum menghubungkannya ke arkus aorta.","fn":"Membawa darah kurang oksigen ke paru.","nerve":"Pleksus kardiakus; baroreseptor di bifurkasio.","blood":"Vasa vasorum dan cabang konus a. koroner.","rel":"Ventrikel kanan, aorta asendens, atrium kiri, arkus aorta (ligamentum arteriosum).","clin":"Emboli paru (sadel di bifurkasio), hipertensi pulmonal, duktus arteriosus paten, stenosis pulmonal."},"pulm_artery":{"desc":"Dua cabang trunkus pulmonalis menuju hilus tiap paru; arteri kanan lebih panjang dan lewat di belakang aorta asendens.","fn":"Membawa darah kurang oksigen ke paru kanan dan kiri.","nerve":"Pleksus pulmonalis (vagus dan simpatis).","blood":"Vasa vasorum dan cabang a. bronkialis.","rel":"Bronkus utama, vena pulmonalis, hilus paru.","clin":"Emboli paru, hipertensi pulmonal, malformasi arteriovenosa paru."},"pulm_vein":{"desc":"Empat vena (dua tiap paru, superior dan inferior) yang bermuara ke atrium kiri.","fn":"Membawa darah kaya oksigen dari paru ke atrium kiri.","nerve":"Pleksus pulmonalis.","blood":"Vasa vasorum dan a. bronkialis.","rel":"Atrium kiri, bronkus utama, a. pulmonalis (hilus).","clin":"Stenosis vena pulmonalis, fibrilasi atrium (fokus ektopik di muara vena pulmonalis, ablasi), anomali aliran vena pulmonalis."},"aorta_asc":{"desc":"Bagian awal aorta sekitar 5 cm dari katup aorta sampai pangkal arkus; sinus Valsalva melahirkan a. koroner.","fn":"Mengalirkan darah beroksigen dari ventrikel kiri dan memasok jantung lewat a. koroner.","nerve":"Pleksus kardiakus; baroreseptor dan kemoreseptor.","blood":"A. koroner kanan dan kiri; vasa vasorum.","rel":"Trunkus pulmonalis, atrium kanan, v. kava superior, perikardium.","clin":"Aneurisma aorta asendens, diseksi aorta tipe A (darurat), regurgitasi aorta, sindrom Marfan."},"aortic_arch":{"desc":"Lengkungan aorta di mediastinum superior dengan tiga cabang: trunkus brakiosefalika, a. karotis komunis kiri, a. subklavia kiri.","fn":"Mengalirkan darah ke kepala, leher, lengan, dan aorta desendens; baroreseptor mengatur tekanan darah.","nerve":"N. vagus kiri dan n. laringeus rekuren kiri (melingkari arkus), n. frenikus kiri; pleksus kardiakus.","blood":"Vasa vasorum; cabang bronkial dan perikardial kecil.","rel":"Trakea, esofagus, duktus torasikus, trunkus pulmonalis, ligamentum arteriosum.","clin":"Diseksi aorta, koarktasio aorta, aneurisma arkus, kompresi n. laringeus rekuren (suara serak)."},"brachiocephalic":{"desc":"Cabang pertama arkus aorta yang pendek (sekitar 4–5 cm), bercabang menjadi a. karotis komunis kanan dan a. subklavia kanan.","fn":"Memasok darah beroksigen ke kepala, leher, dan lengan kanan.","nerve":"Pleksus kardiakus dan serabut simpatis perivaskular.","blood":"Vasa vasorum.","rel":"Trakea (depan), v. brakiosefalika kiri (menyilang), pleura kanan.","clin":"Aneurisma, stenosis (sindrom subclavian steal), kompresi trakea, risiko fistula pada trakeostomi."},"carotid":{"desc":"A. karotis komunis kanan dari trunkus brakiosefalika dan kiri langsung dari arkus aorta; naik di leher dalam selubung karotis.","fn":"Memasok darah ke kepala dan leher; bercabang menjadi a. karotis interna (otak) dan eksterna (wajah).","nerve":"N. vagus (di selubung karotis), sinus karotikus oleh n. glosofaringeus (IX) dan vagus, simpatis.","blood":"Vasa vasorum.","rel":"V. jugularis interna, n. vagus, trakea, kelenjar tiroid, otot sternokleidomastoid.","clin":"Stenosis karotis (stroke iskemik), endarterektomi, diseksi karotis, sinkop sinus karotikus."},"subclavian_a":{"desc":"Kanan dari trunkus brakiosefalika, kiri dari arkus aorta; lewat di antara skalenus anterior dan media menuju aksila.","fn":"Memasok lengan, leher bagian bawah (a. vertebralis, a. torakika interna), dan sebagian otak.","nerve":"Pleksus brakialis (berjalan di sekitarnya); simpatis perivaskular.","blood":"Vasa vasorum; cabang: a. vertebralis, a. torakika interna, trunkus tirokervikalis.","rel":"Pleksus brakialis, v. subklavia, klavikula, rusuk 1, pleura apeks.","clin":"Sindrom subclavian steal, sindrom outlet toraks, cedera pada fraktur klavikula atau rusuk 1."},"aorta_thoracic":{"desc":"Aorta desendens dari T4 sampai hiatus aorta diafragma di T12, melengkung di sisi kiri vertebra.","fn":"Memasok dinding toraks, paru (a. bronkialis), esofagus, dan perikardium.","nerve":"Pleksus aorticus toraks (trunkus simpatikus dan vagus).","blood":"A. interkostalis posterior, a. bronkialis, a. esofageal.","rel":"Esofagus, duktus torasikus, v. azigos, vertebra torakal, paru kiri.","clin":"Diseksi aorta tipe B, aneurisma aorta torakal, koarktasio, trauma deselerasi."},"aorta_abd":{"desc":"Lanjutan aorta di bawah diafragma (T12) sampai bifurkasio menjadi a. iliaka komunis di L4.","fn":"Memasok organ abdomen, dinding abdomen, pelvis, dan tungkai lewat cabang-cabangnya.","nerve":"Pleksus aorticus abdominal (simpatis, ganglion seliakus dan mesenterika).","blood":"Cabang: a. seliaka, a. mesenterika superior dan inferior, aa. renalis, aa. lumbalis, a. iliaka komunis.","rel":"V. kava inferior (kanan), vertebra lumbal, duodenum, pankreas, ginjal.","clin":"Aneurisma aorta abdominal (risiko ruptur), aterosklerosis, sindrom Leriche, diseksi."},"v_brachioceph":{"desc":"V. brakiosefalika kanan dan kiri terbentuk dari v. jugularis interna dan v. subklavia; keduanya bersatu membentuk v. kava superior.","fn":"Mengalirkan darah vena dari kepala, leher, dan lengan ke v. kava superior.","nerve":"Pleksus kardiakus; n. frenikus dan vagus berdekatan.","blood":"Vasa vasorum; v. tiroidea inferior dan v. torakika interna bermuara.","rel":"Trunkus brakiosefalika, arkus aorta, timus, trakea.","clin":"Trombosis, sindrom v. kava superior, komplikasi kateter vena sentral."},"v_subclavian":{"desc":"Lanjutan v. aksilaris di bawah klavikula yang bersatu dengan v. jugularis interna membentuk v. brakiosefalika.","fn":"Mengalirkan darah vena dari lengan.","nerve":"Pleksus brakialis (berdekatan); simpatis.","blood":"Vasa vasorum.","rel":"A. subklavia, klavikula, rusuk 1, skalenus anterior, pleura apeks.","clin":"Trombosis (Paget-Schroetter), akses kateter vena sentral, pneumotoraks iatrogenik."},"ivc":{"desc":"Vena terbesar tubuh, terbentuk dari v. iliaka komunis di L5; naik di sisi kanan aorta melewati hiatus v. kava diafragma (T8) menuju atrium kanan.","fn":"Mengalirkan darah vena dari tubuh bagian bawah (abdomen, pelvis, tungkai) ke atrium kanan.","nerve":"Pleksus aorticus abdominal; n. frenikus di diafragma.","blood":"Vasa vasorum; menerima vv. lumbalis, renalis, hepatika, gonadal kanan.","rel":"Aorta abdominal, hati (alur v. kava), ginjal, duodenum, diafragma.","clin":"Trombosis vena dalam yang menyebar (filter IVC), kompresi saat kehamilan, tumor ginjal menginvasi v. kava."},"artery_gen":{"desc":"Arteri membawa darah dari jantung ke jaringan; dindingnya terdiri dari tunika intima, media (otot polos dan elastin), dan adventisia. Rincian untuk pembuluh ini belum ditulis satu per satu.","fn":"Menyalurkan darah beroksigen (kecuali a. pulmonalis) dengan tekanan tinggi ke organ dan jaringan yang dilayaninya.","nerve":"Serabut simpatis vasomotor di tunika adventisia mengatur diameter pembuluh; baroreseptor pada arteri besar tertentu.","blood":"Vasa vasorum (pembuluh kecil) memberi nutrisi pada dinding arteri besar.","rel":"Biasanya berjalan bersama vena dan saraf dalam berkas neurovaskular; letak tepatnya bergantung pada nama pembuluh.","clin":"Aterosklerosis, aneurisma, emboli, trombosis, diseksi, dan cedera trauma; gejala bergantung pada daerah yang dipasok."},"vein_gen":{"desc":"Vena membawa darah kembali ke jantung; dindingnya lebih tipis dengan katup di banyak vena ekstremitas, dan sinus dura tidak berotot. Rincian untuk pembuluh ini belum ditulis satu per satu.","fn":"Mengalirkan darah kembali ke jantung dengan tekanan rendah (kecuali v. pulmonalis); berfungsi pula sebagai reservoir darah.","nerve":"Serabut simpatis vasomotor mengatur venokonstriksi; vena dalam mengikuti persarafan struktur di dekatnya.","blood":"Vasa vasorum pada vena besar.","rel":"Vena dalam biasanya menyertai arteri; vena superfisial berjalan di jaringan bawah kulit.","clin":"Trombosis vena dalam, varises, tromboflebitis, insufisiensi vena, trombosis sinus (pada sinus dura)."},"int_carotid":{"desc":"Cabang a. karotis komunis yang naik tanpa cabang di leher, masuk tengkorak lewat kanalis karotikus dan membentuk sifon karotis.","fn":"Memasok otak (via a. serebri anterior dan media) dan mata (a. oftalmika).","nerve":"Pleksus karotikus internus (simpatis) mengelilinginya; n. kranial III, IV, V1, VI di sinus kavernosus berdekatan.","blood":"Cabang dari a. karotis komunis; mensuplai lingkaran Willis.","rel":"Sinus kavernosus, kelenjar hipofisis, n. optikus, tulang temporal.","clin":"Stenosis karotis (stroke iskemik), aneurisma sifon, diseksi, fistula karotis-kavernosus."},"ext_carotid":{"desc":"Cabang a. karotis komunis di setinggi tulang tiroid, memiliki 8 cabang: tiroid superior, lingual, fasialis, oksipital, aurikular posterior, faringeal asendens, maksilaris, temporal superfisialis.","fn":"Memasok wajah, kulit kepala, rongga mulut, tiroid, dan dura mater.","nerve":"Pleksus karotikus eksternus (simpatis); n. hipoglosus dan laringeus superior berdekatan.","blood":"Dari a. karotis komunis (bifurkasio setinggi C4).","rel":"Kelenjar parotis, n. fasialis, otot digastrikus, v. jugularis interna.","clin":"Epistaksis berat (ligasi), arteritis temporal, perdarahan wajah."},"vertebral_a":{"desc":"Cabang a. subklavia yang naik melalui foramen transversarium C6–C1, masuk lewat foramen magnum, dan bersatu membentuk a. basilaris.","fn":"Memasok medula, serebelum, dan bagian belakang otak.","nerve":"Pleksus simpatis perivaskular dan ganglion servikal inferior.","blood":"Cabang a. subklavia; memberi a. spinalis anterior dan a. serebelar inferior posterior (PICA).","rel":"Vertebra servikal, atlas, medula oblongata, n. akar servikal.","clin":"Diseksi (setelah manipulasi leher), sindrom Wallenberg (oklusi PICA), subclavian steal."},"basilar":{"desc":"Arteri tunggal garis tengah di permukaan depan pons yang dibentuk penyatuan dua a. vertebralis dan bercabang menjadi dua a. serebri posterior.","fn":"Memasok pons, serebelum, dan bagian belakang otak.","nerve":"Pleksus simpatis perivaskular.","blood":"Dari dua a. vertebralis; memberi cabang pontin, a. serebelar superior dan inferior anterior.","rel":"Pons, klivus, n. abdusens, medula oblongata.","clin":"Oklusi basilar (sindrom locked-in), aneurisma puncak basilar, stroke batang otak."},"aca":{"desc":"Cabang terminal a. karotis interna menuju fisura longitudinal serebri di antara hemisfer.","fn":"Memasok permukaan medial lobus frontal dan parietal (tungkai bawah pada homunkulus).","nerve":"Pleksus simpatis perivaskular.","blood":"Cabang a. karotis interna; dihubungkan a. komunikans anterior.","rel":"Korpus kalosum, fisura longitudinal serebri, a. komunikans anterior.","clin":"Stroke ACA (kelemahan tungkai kontralateral), aneurisma a. komunikans anterior (tersering)."},"mca":{"desc":"Cabang terminal terbesar a. karotis interna yang masuk fisura Sylvius dan bercabang menjadi segmen M1–M4.","fn":"Memasok permukaan lateral otak (korteks motorik wajah dan lengan, area bicara) dan ganglia basalis lewat cabang lentikulostriata.","nerve":"Pleksus simpatis perivaskular.","blood":"Cabang a. karotis interna; cabang striata lateral.","rel":"Fisura Sylvius, insula, ganglia basalis, kapsula interna.","clin":"Stroke MCA (hemiparesis wajah-lengan, afasia pada sisi dominan), aneurisma bifurkasio."},"pca":{"desc":"Cabang terminal a. basilaris yang mengitari batang otak menuju lobus oksipital dan temporal medial.","fn":"Memasok korteks visual (oksipital), talamus, dan temporal bagian bawah.","nerve":"Pleksus simpatis perivaskular.","blood":"Cabang a. basilaris; dihubungkan a. komunikans posterior ke a. karotis interna.","rel":"Tentorium, n. okulomotor (lewat antara a. serebelar superior dan PCA), batang otak.","clin":"Stroke PCA (hemianopsia homonim), aneurisma a. komunikans posterior menekan n. III."},"willis":{"desc":"Arteri penghubung anterior dan posterior yang melengkapi lingkaran Willis di dasar otak.","fn":"Memberi aliran kolateral antar sirkulasi karotis dan vertebrobasilar.","nerve":"Pleksus simpatis perivaskular.","blood":"Menghubungkan a. serebri anterior kiri dan kanan (anterior) serta a. karotis interna dan a. serebri posterior (posterior).","rel":"Kiasma optikum, hipofisis, hipotalamus, n. okulomotor.","clin":"Aneurisma sakular (sering di a. komunikans), kelainan variasi lingkaran Willis, subarakhnoid hemoragik."},"face_a":{"desc":"Cabang a. karotis eksterna: a. fasialis (wajah), a. maksilaris (struktur dalam wajah, dura), a. temporalis superfisialis (kulit kepala).","fn":"Memasok kulit dan otot wajah, gigi, rongga hidung, dan kulit kepala.","nerve":"Pleksus karotikus eksternus (simpatis); n. fasialis berdekatan dengan cabangnya.","blood":"Cabang a. karotis eksterna.","rel":"Kelenjar parotis, mandibula, otot masseter, n. fasialis dan trigeminus.","clin":"Epistaksis (cabang a. sfenopalatina dari a. maksilaris), arteritis temporal, perdarahan epidural (a. meningea media dari maksilaris)."},"ophth":{"desc":"Cabang a. karotis interna yang masuk orbita lewat kanalis optikus bersama n. optikus.","fn":"Memasok bola mata, retina (a. sentralis retina), orbita, dan sebagian wajah.","nerve":"Pleksus simpatis dari karotis internus.","blood":"Cabang a. karotis interna; a. sentralis retina adalah arteri akhir.","rel":"N. optikus, orbita, otot ekstraokular, sinus kavernosus.","clin":"Oklusi a. sentralis retina (kebutaan mendadak), amaurosis fugax."},"jugular_i":{"desc":"Vena besar di leher dalam selubung karotis yang melanjutkan sinus sigmoid dan bersatu dengan v. subklavia membentuk v. brakiosefalika.","fn":"Mengalirkan darah dari otak, wajah, dan leher.","nerve":"N. vagus dan n. aksesorius melewati dekatnya.","blood":"Menerima v. fasialis, lingualis, tiroid superior dan media.","rel":"A. karotis komunis, n. vagus, otot sternokleidomastoid, kelenjar tiroid.","clin":"Akses vena sentral, trombosis, distensi (JVP) pada gagal jantung kanan."},"jugular_e":{"desc":"Vena superfisial leher yang melintang di atas otot sternokleidomastoid, bermuara ke v. subklavia.","fn":"Mengalirkan darah dari kulit kepala dan wajah.","nerve":"N. aurikularis magnus dekat sisi atas.","blood":"Menerima v. oksipital, aurikular posterior, dan suprascapular.","rel":"Otot platisma, sternokleidomastoid, fasia servikal.","clin":"Akses vena perifer darurat, tanda distensi pada gagal jantung."},"dural_sinus":{"desc":"Saluran vena di dura mater tanpa katup dan tanpa otot: sinus sagitalis superior, transversus, dan sigmoideus.","fn":"Mengalirkan darah vena dari otak dan LCS (granulasi arakhnoid) ke v. jugularis interna.","nerve":"Persarafan dura oleh cabang trigeminus (V).","blood":"Bermuara ke v. jugularis interna melalui sinus sigmoideus.","rel":"Tulang tengkorak, otak, falks serebri, tentorium.","clin":"Trombosis sinus vena serebral, infeksi menyebar (tromboflebitis), perdarahan akibat robekan."},"cavernous":{"desc":"Pasangan sinus dura di kedua sisi sela tursika, dilalui a. karotis interna dan n. III, IV, V1, V2, VI.","fn":"Mengalirkan darah dari orbita dan otak ke sinus petrosus.","nerve":"N. kranial III, IV, V1, V2, VI melewatinya.","blood":"Menerima v. oftalmika dan sinus sfenoparietal.","rel":"Hipofisis, sinus sfenoid, a. karotis interna, kiasma optikum.","clin":"Trombosis sinus kavernosus (infeksi wajah 'segitiga bahaya'), fistula karotis-kavernosus, sindrom fisura orbital."},"face_v":{"desc":"Vena wajah dan kepala: v. fasialis, lingualis, maksilaris, temporalis superfisialis yang bermuara ke v. jugularis.","fn":"Mengalirkan darah dari wajah, lidah, dan kulit kepala.","nerve":"Serabut simpatis vasomotor di dinding pembuluh.","blood":"Bermuara ke v. jugularis interna dan eksterna.","rel":"Otot wajah, kelenjar parotis, mandibula, pleksus pterigoideus.","clin":"Infeksi wajah bisa menyebar ke sinus kavernosus lewat v. oftalmika; trombosis."},"axillary_a":{"desc":"Lanjutan a. subklavia dari tepi luar rusuk 1 sampai tepi bawah otot teres mayor, dibagi 3 bagian oleh otot pektoralis minor.","fn":"Memasok bahu, dinding dada, dan lengan atas.","nerve":"Pleksus brakialis mengelilinginya (fasikulus lateral, medial, posterior).","blood":"Cabang: a. torakoakromial, torakal lateral, subskapular, sirkumfleksa humeri.","rel":"Pleksus brakialis, v. aksilaris, otot pektoralis, kelenjar getah bening aksilaris.","clin":"Cedera pada fraktur kolum humerus, aneurisma, kompresi pleksus, kanulasi."},"axillary_v":{"desc":"Vena yang melanjutkan v. basilika dari tepi bawah teres mayor sampai tepi luar rusuk 1, lalu menjadi v. subklavia.","fn":"Mengalirkan darah dari lengan, bahu, dan dinding dada lateral.","nerve":"Serabut simpatis vasomotor di dinding pembuluh.","blood":"Menerima v. sefalika, v. brakialis, dan cabang toraks lateral.","rel":"A. aksilaris, pleksus brakialis, kelenjar getah bening aksilaris.","clin":"Trombosis vena aksilaris (usaha berlebihan), edema lengan pasca diseksi kelenjar getah bening."},"brachial_a":{"desc":"Lanjutan a. aksilaris di lengan atas dari teres mayor sampai fossa kubiti, di mana ia bercabang menjadi a. radialis dan ulnaris.","fn":"Memasok lengan atas dan siku (a. profunda brakii, kolateral ulnar).","nerve":"N. medianus menyilang di depannya; n. ulnaris dan radialis berdekatan.","blood":"Cabang: a. profunda brakii, kolateral ulnar superior dan inferior.","rel":"N. medianus, v. brakialis, otot bisep, humerus.","clin":"Fraktur suprakondilar (cedera, iskemia Volkmann), pengukuran tekanan darah, kanulasi."},"radial_a":{"desc":"Cabang a. brakialis di fossa kubiti yang berjalan di sisi lateral lengan bawah; titik nadi di pergelangan.","fn":"Memasok lengan bawah lateral, tangan, dan ibu jari.","nerve":"N. radialis superfisialis berjalan di dekatnya.","blood":"Cabang karpal palmar dan dorsal, arkus palmaris profundus.","rel":"Otot brakioradialis, tendon fleksor karpi radialis, anatomical snuffbox.","clin":"Titik nadi radialis, kanulasi arteri, tes Allen, graft koroner."},"ulnar_a":{"desc":"Cabang a. brakialis yang lebih besar, berjalan di sisi medial lengan bawah dan membentuk arkus palmaris superfisialis.","fn":"Memasok lengan bawah medial dan sebagian besar tangan.","nerve":"N. ulnaris menyertai sepanjang jalurnya.","blood":"Cabang: a. interoseus komunis, arkus palmaris superfisialis.","rel":"N. ulnaris, tendon fleksor karpi ulnaris, hamulus tulang hamatum.","clin":"Sindrom hipotenar martil, cedera kanalis Guyon, iskemia jari."},"palmar_arch":{"desc":"Arkus palmaris superfisialis (dari a. ulnaris) dan profunda (dari a. radialis) di telapak tangan.","fn":"Memasok jari-jari lewat aa. digitales palmares.","nerve":"N. medianus dan ulnaris di sekitar.","blood":"Anastomosis a. radialis dan ulnaris.","rel":"Tendon fleksor, tulang metakarpal, aponeurosis palmaris.","clin":"Tes Allen, cedera luka tusuk telapak tangan (perdarahan berat), iskemia tangan."},"arm_v":{"desc":"Vena superfisial lengan: v. sefalika (lateral), v. basilika (medial), v. mediana kubiti (menghubungkan keduanya di fossa kubiti).","fn":"Mengalirkan darah dari tangan dan lengan; tempat pengambilan darah dan pemasangan infus.","nerve":"Serabut simpatis vasomotor di dinding pembuluh.","blood":"V. sefalika ke v. aksilaris, v. basilika ke v. brakialis.","rel":"Fascia superfisial, n. kutaneus antebrakial, a. brakialis (di bawah v. mediana kubiti).","clin":"Flebotomi, kateter PICC, tromboflebitis, fistula arteriovenosa untuk dialisis."},"int_thoracic":{"desc":"A. torakika interna (a. mamaria interna) dari a. subklavia turun di belakang rusuk dekat sternum; v. torakika interna menyertainya.","fn":"Memasok dinding dada anterior, payudara, dan diafragma; cabang akhir: a. epigastrika superior.","nerve":"N. interkostalis dan frenikus berdekatan.","blood":"Cabang a. subklavia; menyambung ke a. epigastrika inferior.","rel":"Sternum, rusuk dan tulang rawan, pleura, otot interkostalis.","clin":"Graft CABG ke LAD, cedera pada trauma dada, sirkulasi kolateral koarktasio aorta."},"azygos":{"desc":"Vena di sisi kanan vertebra torakal yang naik dan melengkung di atas bronkus kanan menuju v. kava superior (arkus azigos).","fn":"Mengalirkan darah dari dinding toraks dan esofagus; jalur kolateral antara v. kava superior dan inferior.","nerve":"Serabut simpatis vasomotor di dinding pembuluh.","blood":"Menerima v. interkostalis posterior, hemiazigos, dan v. esofagus.","rel":"Esofagus, aorta torakalis, duktus torasikus, vertebra.","clin":"Kolateral pada obstruksi v. kava, varises esofagus, pelebaran pada kehamilan dan hipertensi portal."},"portal":{"desc":"Vena sekitar 8 cm yang terbentuk dari v. mesenterika superior dan v. splenika di belakang leher pankreas, naik ke hati.","fn":"Membawa darah vena kaya nutrien dari saluran cerna, pankreas, dan limpa ke hati.","nerve":"Pleksus hepatikus (simpatis dan vagus).","blood":"Menerima v. splenika, v. mesenterika superior, v. gastrika kiri; menyumbang sekitar 75% aliran darah hati.","rel":"Ligamentum hepatoduodenale (bersama a. hepatika dan duktus koledokus), pankreas, duodenum.","clin":"Hipertensi portal (varises esofagus, asites), trombosis v. porta, sirosis."},"hepatic_v":{"desc":"Tiga vena hepatika (kanan, tengah, kiri) yang mengalirkan darah dari hati langsung ke v. kava inferior di bawah diafragma.","fn":"Mengalirkan darah dari hati ke sirkulasi sistemik.","nerve":"Pleksus hepatikus.","blood":"Menerima darah dari v. sentralis lobulus hati.","rel":"Hati, v. kava inferior, diafragma.","clin":"Sindrom Budd-Chiari (trombosis vena hepatika), gagal jantung kongestif (hepatomegali)."},"splenic":{"desc":"A. splenika (cabang truncus coeliacus) berjalan di tepi atas pankreas ke hilus limpa; v. splenika berjalan di belakang pankreas.","fn":"Memasok limpa, pankreas, dan lambung (a. gastrika pendek, gastroepiploika kiri).","nerve":"Pleksus seliakus (simpatis).","blood":"A. splenika dari truncus coeliacus; v. splenika bersatu dengan v. mesenterika superior membentuk v. porta.","rel":"Pankreas, lambung, limpa, ginjal kiri, kelenjar suprarenal.","clin":"Aneurisma a. splenika (ruptur pada kehamilan), infark limpa, trombosis v. splenika menyebabkan varises lambung."},"iliac_a":{"desc":"A. iliaka komunis bercabang dari aorta di L4 menjadi a. iliaka interna (pelvis) dan eksterna (tungkai).","fn":"Memasok pelvis dan tungkai bawah; a. iliaka eksterna menjadi a. femoralis di ligamentum inguinal.","nerve":"Pleksus hipogastrik dan iliakus (simpatis).","blood":"Interna: a. gluteus, pudenda interna, vesikalis, uterina; eksterna: a. epigastrika inferior dan sirkumfleksa iliaka.","rel":"Ureter menyilangnya, v. iliaka, otot psoas, sakrum.","clin":"Aneurisma iliaka, aterosklerosis (klaudikasio), sindrom Leriche, cedera ureter saat operasi."},"iliac_v":{"desc":"V. iliaka komunis kiri dan kanan bersatu membentuk v. kava inferior di L5.","fn":"Mengalirkan darah vena dari tungkai dan pelvis.","nerve":"Serabut simpatis vasomotor di dinding pembuluh.","blood":"Menerima v. iliaka interna dan eksterna.","rel":"A. iliaka (di depan atau belakang), ureter, otot psoas.","clin":"Trombosis vena iliofemoral, sindrom May-Thurner (kompresi v. iliaka kiri oleh a. iliaka kanan)."},"sma":{"desc":"A. mesenterika superior keluar dari aorta di L1, di bawah truncus coeliacus, menyilang di depan duodenum bagian 3.","fn":"Memasok usus halus (dari duodenum distal), sekum, kolon asendens, dan 2/3 proksimal kolon transversum.","nerve":"Pleksus mesenterika superior (simpatis dan vagus).","blood":"Cabang: a. pankreatikoduodenalis inferior, jejunalis, ileal, ileokolika, kolika kanan dan media.","rel":"Vena mesenterika superior, v. renalis kiri, pankreas, duodenum.","clin":"Iskemia mesenterika akut (emboli), sindrom a. mesenterika superior (kompresi duodenum), angina intestinal."},"ima":{"desc":"A. mesenterika inferior keluar dari aorta di L3, 3–4  L.m.meta.forEach(m=>{const nv=m[1],nf=m[2],vo=m[3],fo=m[4],p=new Float32Array(nv*3);

  const sm=/\.[a-z0-9]*([rl])$/.exec(n);me.userData.side=sm?sm[1]:/leaflet/i.test(n)?'':/right/i.test(n)?'r':/left/i.test(n)?'l':'';if(isOrg(k)){if(/Pleura|Mucosa|omentum|Mesocolon|Meso-appendix/i.test(n))me.userData.gh=.28;if(/segment_of_liver|taenia/i.test(n))me.userData.hid=1}me.visible=false;scene.add(me);arr.push(me)});

for(const k in VSN){NAMES[k]=['Pembuluh Darah · '+VSN[k]+' (Vasa sanguinea)','Cari pembuluh…'];TITLE[k]='Pembuluh Darah · '+VSN[k];LATIN[k]='Vasa sanguinea';HELP[k]='Pilih pembuluh di sidebar (daftar diurutkan abjad menurut nama Inggris dari file model). Merah = arteri, biru = vena. Rangka tampil samar sebagai konteks. Nama Indonesia dan penjelasan rinci tiap pembuluh belum ditulis; penjelasan yang tampil bersifat umum.';EM[k]=0x7a3030}
const NOTE='<div class="note">Model 3D: BodyParts3D © DBCLS (CC BY-SA) melalui Z-Anatomy (CC BY-SA 4.0), disederhanakan untuk web. Konten edukasi, bukan pengganti rujukan medis.</div>';
const mark=()=>document.querySelectorAll('.it').forEach(e=>e.classList.toggle('on',e.dataset.id===curId));
function build(f=''){list.innerHTML='';
 const mk=o=>{const b=document.createElement('button');b.className='it';b.dataset.id=o.id;b.innerHTML=o.n+(o.l?'<i>'+o.l+'</i>':'');b.onclick=()=>pick(o.id);list.appendChild(b)};
 if(!f)mk({id:'__all',n:'🧍 Tampilkan semua',l:LATIN[layer]});
 BL[layer].g.forEach(g=>{const its=g.items.filter(o=>(o.n+o.l+o.e).toLowerCase().includes(f));if(!its.length)return;
  const h=document.createElement('div');h.className='grp';h.textContent=g.g+' ('+its.length+')';list.appendChild(h);its.forEach(mk)});mark()}
const cards=d=>`<div class="grid"><div class="card"><h3>Deskripsi</h3><p>${d.desc}</p></div><div class="card"><h3>Fungsi</h3><p>${d.fn}</p></div><div class="card"><h3>Hubungan</h3><p><b>Persarafan:</b> ${d.nerve}</p><p><b>Suplai darah:</b> ${d.blood}</p><p><b>Struktur terkait:</b> ${d.rel}</p></div><div class="card"><h3>Korelasi klinis</h3><p>${d.clin}</p></div></div>`;
function render(it){let h;
 if(!it)h=`<h2>${TITLE[layer]}</h2><div class="sub"><i>${LATIN[layer]}</i> · ${MESH[layer].length} struktur</div><div class="grid"><div class="card"><h3>Cara memakai</h3><p>${HELP[layer]} Seret untuk memutar, scroll atau cubit untuk zoom, klik kanan untuk menggeser. Klik langsung struktur di model untuk memilihnya, atau klik area kosong untuk membatalkan pilihan.</p><p><b>Sorot/Isolasi:</b> sorot membuat struktur lain memudar, isolasi menyembunyikannya. <b>Kanan/Kiri:</b> sembunyikan salah satu sisi tubuh.</p></div></div>`;
 else{const d=it.d&&DET[it.d];
  h=`<h2>${it.n}</h2><div class="sub">${it.l&&it.l!==it.e?'<i>'+it.l+'</i> · ':''}${it.e}</div><div class="tags"><span>${it.r}</span><span>Sisi: ${it.s}</span></div>`;
  h+=d?cards(d)+(it.g?`<div class="note">Penjelasan di atas bersifat umum untuk kelompok ini, bukan khusus ${it.n}.</div>`:''):`<div class="grid"><div class="card"><h3>Lokasi</h3><p>Bagian dari ${it.r}.</p></div><div class="card"><h3>Keterangan</h3><p>Deskripsi, persarafan, suplai darah, dan korelasi klinis untuk struktur ini belum ditulis.</p></div></div>`}
 info.innerHTML=h+NOTE;info.scrollTop=0;$('ittl').textContent='Deskripsi · '+(it?it.n:TITLE[layer])}
function pick(id,nf){if(!MESH[layer])return;curId=id;const it=id==='__all'?null:BL[layer].g.flatMap(g=>g.items).find(o=>o.id===id);
 sel=it?new Set(it.p):null;refresh();if(!nf)focus((it?it.p.map(i=>MESH[layer][i]):MESH[layer]));mark();render(it)}
function setLayer(k){layer=k;curId=null;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x.dataset.l===(isOrg(k)?'organ':k)));
 $('ttl').textContent=NAMES[k][0];$('sys').style.display=isOrg(k)?'flex':'none';if(isOrg(k))$('sysel').value=k;$('q').placeholder=NAMES[k][1];$('q').value='';build();ensure(k)}
async function ensure(k){const ld=$('ld');refresh();
 if(!MESH[k]){ld.style.display='flex';ld.innerHTML='<div class="spn"></div><div>Memuat model…</div>';
  try{await loadLayer(k)}catch(e){if(layer===k){ld.innerHTML='<div>Gagal memuat model ('+e.message+')</div><button id="rt">Coba lagi</button>';$('rt').onclick=()=>ensure(k)}return}}
 if(layer!==k)return;ld.style.display='none';pick('__all');
 if(k!=='rangka'&&!MESH.rangka)loadLayer('rangka').then(refresh).catch(()=>{})}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setLayer(b.dataset.l==='organ'?$('sysel').value:b.dataset.l));
$('q').oninput=e=>build(e.target.value.toLowerCase().trim());
document.querySelectorAll('.sg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=g.dataset.g,v=b.dataset.v;
 if(k==='ctx'){ctxOn=!ctxOn;b.classList.toggle('on',ctxOn)}else{g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));if(k==='mode')iso=v==='iso';else side=v}
 refresh()}));
function theme(t){document.documentElement.dataset.theme=t;$('th').textContent=t==='dark'?'☀':'🌙';try{localStorage.setItem('th',t)}catch(e){}}
let t0=null;try{t0=localStorage.getItem('th')}catch(e){}
theme(t0||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
$('th').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');
// ===== klik langsung di model 3D =====
const tip=$('tip'),rc=new THREE.Raycaster(),mv=new THREE.Vector2(),IDX={};
function owner(i){if(!IDX[layer]){IDX[layer]={};BL[layer].g.forEach(g=>g.items.forEach(o=>o.p.forEach(j=>IDX[layer][j]=o)))}return IDX[layer][i]}
function hit(e){if(!MESH[layer])return null;const r=cv.getBoundingClientRect();mv.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);rc.setFromCamera(mv,cam);
 const h=rc.intersectObjects(MESH[layer].filter(m=>m.visible&&!m.userData.gh),false)[0];return h?owner(MESH[layer].indexOf(h.object)):null}
let dn=null,last=0;
cv.addEventListener('pointerdown',e=>{dn=[e.clientX,e.clientY]});
cv.addEventListener('pointerup',e=>{const d=dn;dn=null;if(!d||e.button>0||Math.hypot(e.clientX-d[0],e.clientY-d[1])>5)return;
 const o=hit(e);if(o){if($('q').value){$('q').value='';build()}pick(o.id,true);const b=document.querySelector('.it.on');if(b)b.scrollIntoView({block:'nearest'})}else if(sel)pick('__all',true)});
cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch'||(MESH[layer]&&MESH[layer].length>150)){tip.style.display='none';return}const t=performance.now();if(t-last<90)return;last=t;
 const o=hit(e);cv.style.cursor=o?'pointer':'';if(o){const r=cv.getBoundingClientRect();tip.textContent=o.n;tip.style.display='block';tip.style.left=(e.clientX-r.left+14)+'px';tip.style.top=(e.clientY-r.top+14)+'px'}else tip.style.display='none'});
cv.addEventListener('pointerleave',()=>{tip.style.display='none'});
// ===== panel bisa ditutup dan diatur ukurannya =====
const root=document.documentElement,bd=document.body,mob=()=>matchMedia('(max-width:760px)').matches,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
function drag(h,fn){h.addEventListener('pointerdown',e=>{e.preventDefault();h.setPointerCapture(e.pointerId);const mm=ev=>fn(ev),up=()=>{h.removeEventListener('pointermove',mm);h.removeEventListener('pointerup',up)};h.addEventListener('pointermove',mm);h.addEventListener('pointerup',up)})}
drag($('rz1'),e=>{if(mob()){const r=bd.getBoundingClientRect();root.style.setProperty('--sh',cl(e.clientY-r.top,80,r.height*.7)+'px')}else root.style.setProperty('--sw',cl(e.clientX,180,Math.min(560,innerWidth*.6))+'px')});
drag($('rz2'),e=>{const r=$('main').getBoundingClientRect();root.style.setProperty('--ih',cl(r.bottom-e.clientY-36,60,Math.max(120,r.height-260))+'px')});
$('sbt').onclick=()=>bd.classList.toggle('sc');
$('itg').onclick=e=>{e.stopPropagation();$('itg').textContent=bd.classList.toggle('ic')?'▴':'▾'};
$('ihd').onclick=()=>$('itg').click();
$('sysel').onchange=e=>setLayer(e.target.value);
setLayer('rangka');
</script>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas Anatomi Manusia</title>
<style>
:root{--bg:#fff;--panel:#fff;--txt:#111;--mut:#6a6a6a;--acc:#b5532a;--line:#e5e5e5;--view:#fff;--dot:#cdcdcd;--soft:#f5f5f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0b;--panel:#131315;--txt:#f1f1f1;--mut:#999;--acc:#e58a5c;--line:#26262a;--view:#0a0a0b;--dot:#2e2e34;--soft:#1b1b1e}}
:root[data-theme="dark"]{--bg:#0a0a0b;--panel:#131315;--txt:#f1f1f1;--mut:#999;--acc:#e58a5c;--line:#26262a;--view:#0a0a0b;--dot:#2e2e34;--soft:#1b1b1e}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;height:100vh;height:100dvh}
#side{width:var(--sw,280px);flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.sc #side{width:0;border-right:0}
#rz1{width:6px;margin-left:-3px;flex:none;cursor:col-resize;position:relative;z-index:3;touch-action:none}
#rz1:hover{background:var(--acc);opacity:.5}
.sc #rz1{display:none}
#hd{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 2px 12px}
#hd h1{font-size:16px;margin:0}
button{font-family:inherit}
#th{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--txt);cursor:pointer;font-size:15px}
#ttl{padding:0 12px 10px;color:var(--mut);font-size:12px;line-height:1.35}
#tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 12px 10px}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--txt);font-size:11px;line-height:1.2;cursor:pointer}
#tabs button b{font-size:17px;font-weight:400}
#tabs button.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
#sys{display:none;margin:0 12px 10px}
#sys select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--txt);font-size:13px}
#q{margin:0 12px 8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--txt);font-size:14px}
#list{overflow-y:auto;flex:1;padding-bottom:12px;border-top:1px solid var(--line)}
.grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);font-weight:700;padding:14px 16px 4px}
.it{display:block;width:100%;text-align:left;border:0;background:none;color:var(--txt);padding:7px 16px 7px 22px;font-size:14px;cursor:pointer;border-left:3px solid transparent}
.it i{display:block;font-size:11px;color:var(--mut)}
.it:hover{background:var(--soft)}
.it.on{background:var(--soft);border-left-color:var(--acc);font-weight:600}
#main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
#vw{position:relative;flex:1;min-height:140px;background-color:var(--view);background-image:radial-gradient(var(--dot) 1.3px,transparent 1.6px);background-size:22px 22px;border-bottom:1px solid var(--line)}
#cv{width:100%;height:100%;display:block;touch-action:none}
#ld{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mut);font-size:14px;pointer-events:none;z-index:1}
#ld button{pointer-events:auto;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--txt);cursor:pointer}
.spn{width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#tip{position:absolute;display:none;pointer-events:none;background:var(--txt);color:var(--bg);font-size:12px;padding:3px 8px;border-radius:6px;white-space:nowrap;z-index:2}
#ctl{position:absolute;right:12px;top:12px;display:flex;gap:6px}
#ctl button,.sg button{border:1px solid var(--line);background:var(--panel);color:var(--txt);cursor:pointer}
#ctl button{width:36px;height:36px;border-radius:8px;font-size:16px}
#bar{position:absolute;left:12px;bottom:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap}
.sg{display:flex}
.sg button{padding:6px 10px;font-size:12px;margin-left:-1px}
.sg button:first-child{border-radius:8px 0 0 8px;margin-left:0}
.sg button:last-child{border-radius:0 8px 8px 0}
.sg button:only-child{border-radius:8px}
.sg button.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
#dsc{display:flex;flex-direction:column;flex:none;margin:0 10px 10px;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08)}
#info{flex:none;height:var(--ih,240px);max-height:70vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding:12px 18px 20px}
#rz2{height:16px;flex:none;cursor:row-resize;position:relative;touch-action:none;display:flex;align-items:center;justify-content:center}
#rz2::after{content:"";width:44px;height:4px;border-radius:2px;background:var(--line)}
#rz2:hover::after{background:var(--acc)}
#ihd{display:flex;align-items:center;justify-content:space-between;gap:8px;height:36px;flex:none;padding:0 12px 0 16px;background:var(--panel);cursor:pointer;font-size:13px;font-weight:600;border-bottom:1px solid var(--line)}
.ic #ihd{border-bottom:0}
#ittl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#itg{width:30px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--soft);color:var(--txt);cursor:pointer}
.ic #info,.ic #rz2{display:none}
#sbt{position:absolute;left:12px;top:12px;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--txt);cursor:pointer;font-size:16px}
#info h2{margin:0;font-size:24px}
.sub{color:var(--mut);margin:2px 0 12px;font-size:14px}
.tags span{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12px;margin:0 6px 6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h3{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.card p{margin:0 0 6px;font-size:14px;line-height:1.55}
.note{font-size:12px;color:var(--mut);margin-top:14px}
@media(max-width:760px){body{flex-direction:column}#side{width:100%;height:var(--sh,30%);border-right:0;border-bottom:1px solid var(--line)}.sc #side{width:100%;height:0;border-bottom:0}#rz1{width:100%;height:6px;margin:-3px 0 0;cursor:row-resize}#dsc{margin:0 8px 8px}#info{height:var(--ih,34vh);height:var(--ih,34dvh);max-height:60vh;max-height:60dvh;padding:10px 14px 18px}.grid{grid-template-columns:1fr}#info h2{font-size:20px}#hd{padding-top:8px}}
</style>
</head>

nodes","n":"Nodus Limfatik · Medial common iliac","l":"","e":"Medial common iliac nodes","r":"Pelvis & Tungkai","s":"garis tengah","p":[70],"d":"node_gen","g":1},{"id":"Medial_external_iliac_nodes","n":"Nodus Limfatik · Medial external iliac","l":"","e":"Medial external iliac nodes","r":"Pelvis & Tungkai","s":"kanan & kiri","p":[76,77],"d":"node_gen","g":1},{"id":"(Medial_lacunar_node)","n":"Nodus Limfatik · Medial lacunar","l":"","e":"(Medial lacunar node)","r":"Pelvis & Tungkai","s":"kanan & kiri","p":[78,114],"d":"node_gen","g":1},{"id":"Median_sacral_nodes","n":"Nodus Limfatik · Median sacral","l":"","e":"Median sacral nodes","r":"Pelvis & Tungkai","s":"garis tengah","p":[73],"d":"node_gen","g":1},{"id":"Obturator_nodes","n":"Nodus Limfatik · Obturator","l":"","e":"Obturator nodes","r":"Pelvis & Tungkai","s":"kanan & kiri","p":[81,82],"d":"node_gen","g":1},{"id":"Pararectal_nodes","n":"Nodus Limfatik · Pararectal","l":"","e":"Pararectal nodes","r":"Pelvis & Tungkai","s":"garis tengah","p":[93],"d":"node_gen","g":1},{"id":"(Posterior_tibial_node)","n":"Nodus Limfatik · Posterior tibial","l":"","e":"(Posterior tibial node)","r":"Pelvis & Tungkai","s":"kanan & kiri","p":[111,113],"d":"node_gen","g":1},{"id":"Postvesical_nodes","n":"Nodus Limfatik · Postvesical","l":"","e":"Postvesical nodes","r":"Pelvis & Tungkai","s":"garis tengah","p":[90],"d":"node_gen","g":1},{"id":"Prevesical_nodes","n":"Nodus Limfatik · Prevesical","l":"","e":"Prevesical nodes","r":"Pelvis & Tungkai","s":"garis tengah","p":[89],"d":"node_gen","g":1},{"id":"(Proximal_deep_inguinal_node)","n":"Nodus Limfatik · Proximal deep inguinal","l":"","e":"(Proximal deep inguinal node)","r":"Pelvis & Tungkai","s":"kanan & kiri","p":[100,102],"d":"node_gen","g":1},{"id":"Superficial_popliteal_nodes","n":"Nodus Limfatik · Superficial popliteal","l":"","e":"Superficial popliteal nodes","r":"Pelvis & Tungkai","s":"kanan & kiri","p":[104,107],"d":"node_gen","g":1},{"id":"Superior_gluteal_nodes","n":"Nodus Limfatik · Superior gluteal","l":"","e":"Superior gluteal nodes","r":"Pelvis & Tungkai","s":"kanan & kiri","p":[84,86],"d":"node_gen","g":1},{"id":"Superolateral_superficial_inguinal_nodes","n":"Nodus Limfatik · Superolateral superficial inguinal","l":"","e":"Superolateral superficial inguinal nodes","r":"Pelvis & Tungkai","s":"kanan & kiri","p":[95,98],"d":"node_gen","g":1},{"id":"Superomedial_superficial_inguinal_nodes","n":"Nodus Limfatik · Superomedial superficial inguinal","l":"","e":"Superomedial superficial inguinal nodes","r":"Pelvis & Tungkai","s":"kanan & kiri","p":[97,99],"d":"node_gen","g":1}]}]}};const DET={"cranium":{"desc":"Kotak tulang yang tersusun dari 8 tulang neurokranium (frontal, 2 parietal, 2 temporal, oksipital, sfenoid, etmoid) dan 14 tulang viserokranium yang dihubungkan oleh sutura.","fn":"Melindungi otak dan organ indra, menjadi kerangka wajah, serta tempat melekat otot kepala dan pengunyahan.","nerve":"Nervus trigeminus (V) untuk periosteum dan dura; foramen dilalui 12 saraf kranial.","blood":"A. meningea media, a. temporalis superfisialis, a. oftalmika.","rel":"Mandibula (sendi temporomandibular), vertebra C1 (sendi atlanto-oksipital), otak, meningen.","clin":"Fraktur basis kranii, hematoma epidural (robekan a. meningea media pada fraktur pterion), kraniosinostosis."},"mandibula":{"desc":"Satu-satunya tulang kepala yang dapat bergerak. Terdiri dari korpus, ramus, angulus, prosesus kondiloideus, dan prosesus koronoideus.","fn":"Tempat gigi bawah, mengunyah, berbicara, dan tempat melekat otot pengunyahan.","nerve":"N. alveolaris inferior (cabang V3), n. mentalis.","blood":"A. alveolaris inferior (cabang a. maksilaris).","rel":"Os temporal (sendi TMJ), otot masseter, temporalis, pterigoid.","clin":"Fraktur korpus/kondilus, dislokasi sendi temporomandibular, osteomielitis."},"vertebra":{"desc":"Terdiri dari korpus, arkus vertebra, foramen vertebrale, prosesus spinosus, 2 prosesus transversus, dan prosesus artikularis. Dibagi: 7 servikal, 12 torakal, 5 lumbal, 5 sakral (menyatu), 4 koksigeal.","fn":"Menopang tubuh, melindungi medula spinalis, memungkinkan fleksi/ekstensi/rotasi batang tubuh.","nerve":"Rami meningeal dari saraf spinal; 31 pasang saraf spinal keluar lewat foramen intervertebralis.","blood":"Arteri vertebralis, interkostal posterior, lumbal.","rel":"Diskus intervertebralis, ligamen longitudinal, medula spinalis, kosta (torakal).","clin":"Hernia nukleus pulposus (HNP), skoliosis, spondilolistesis, fraktur kompresi osteoporotik."},"sternum":{"desc":"Tulang pipih terdiri dari manubrium, korpus, dan prosesus xifoideus.","fn":"Melindungi jantung dan pembuluh besar, tempat melekat kosta dan klavikula.","nerve":"Rami kutaneus anterior dari n. interkostalis.","blood":"A. torakika interna (a. mamaria interna).","rel":"Kosta 1–7 (via tulang rawan), klavikula (sendi sternoklavikular), jantung.","clin":"Fraktur sternum akibat trauma tumpul, sternotomi median pada bedah jantung."},"kosta":{"desc":"Terdiri dari kaput, kolum, dan korpus. Kosta 1–7 sejati, 8–10 palsu, 11–12 melayang.","fn":"Membentuk sangkar toraks, melindungi paru dan jantung, dan bergerak saat bernapas.","nerve":"N. interkostalis (T1–T11), n. subkostal (T12).","blood":"Aa. interkostalis posterior dan anterior.","rel":"Vertebra torakal, sternum, otot interkostal, pleura.","clin":"Fraktur kosta, flail chest, pneumotoraks, kosta servikal."},"klavikula":{"desc":"Tulang panjang berbentuk S yang menghubungkan ekstremitas atas ke rangka aksial.","fn":"Menjaga posisi bahu, meneruskan beban dari lengan ke batang tubuh, melindungi pleksus brakialis.","nerve":"N. supraklavikularis, n. subklavius.","blood":"A. suprascapularis, a. torakoakromialis.","rel":"Sternum, akromion skapula, otot subklavius, pleksus brakialis.","clin":"Fraktur sepertiga tengah (paling sering), dislokasi sendi akromioklavikular."},"skapula":{"desc":"Tulang pipih segitiga dengan spina skapula, akromion, prosesus korakoideus, dan kavitas glenoidalis.","fn":"Membentuk sendi bahu dan tempat melekat otot rotator cuff.","nerve":"N. suprascapularis, n. aksilaris, n. dorsalis skapula.","blood":"A. suprascapularis, a. sirkumfleksa skapula.","rel":"Humerus (sendi glenohumeral), klavikula, otot rotator cuff.","clin":"Fraktur skapula, scapular winging (lesi n. torakalis longus)."},"humerus":{"desc":"Tulang panjang dengan kaput, kolum anatomikum dan kirurgikum, korpus, dan epikondilus.","fn":"Gerakan lengan di bahu dan siku, tempat melekat otot deltoid, bisep, dan trisep.","nerve":"N. radialis (menyilang sulkus spiralis), n. aksilaris (kolum kirurgikum).","blood":"A. brakialis, a. profunda brachii, aa. sirkumfleksa humeri.","rel":"Skapula, radius, ulna, otot rotator cuff.","clin":"Fraktur kolum kirurgikum (risiko n. aksilaris), fraktur korpus (n. radialis → wrist drop), fraktur suprakondilar."},"radius":{"desc":"Tulang lengan bawah lateral; ujung distalnya lebar membentuk sendi pergelangan tangan.","fn":"Pronasi–supinasi lengan bawah dan menopang pergelangan tangan.","nerve":"N. interoseus posterior, n. radialis superfisialis.","blood":"A. radialis, a. interoseus anterior.","rel":"Ulna (membran interoseus), humerus, tulang karpal skafoid dan lunatum.","clin":"Fraktur Colles (distal), fraktur Smith, fraktur kaput radius."},"ulna":{"desc":"Tulang lengan bawah medial dengan olekranon di proksimal yang membentuk tonjolan siku.","fn":"Membentuk sendi siku (engsel) bersama humerus; stabilitas lengan bawah.","nerve":"N. ulnaris, n. interoseus anterior.","blood":"A. ulnaris, a. interoseus.","rel":"Humerus, radius, otot trisep (insersi di olekranon).","clin":"Fraktur olekranon, fraktur Monteggia, neuropati ulnaris (cubital tunnel)."},"pelvis":{"desc":"Gabungan ilium, iskium, dan pubis yang menyatu di asetabulum. Bersama sakrum dan koksigis membentuk cincin pelvis.","fn":"Menopang batang tubuh, menyalurkan beban ke tungkai, melindungi organ pelvis, dan jalan lahir.","nerve":"N. iskiadikus, n. femoralis, n. obturatorius, pleksus lumbosakral.","blood":"A. iliaka interna, a. gluteus superior/inferior, a. obturatoria.","rel":"Sakrum (sendi sakroiliaka), femur (sendi panggul), simfisis pubis.","clin":"Fraktur pelvis (perdarahan hebat), fraktur asetabulum, displasia panggul."},"femur":{"desc":"Tulang terpanjang dan terkuat. Memiliki kaput, kolum, trokanter mayor dan minor, korpus, dan kondilus.","fn":"Menopang berat badan, berjalan, berlari, dan tempat melekat otot besar paha.","nerve":"N. femoralis dan n. iskiadikus (otot-otot pada femur).","blood":"A. femoralis profunda, aa. sirkumfleksa femoris medial/lateral (ke kaput femur).","rel":"Asetabulum, tibia, patela, otot kuadrisep dan hamstring.","clin":"Fraktur kolum femoris (risiko nekrosis avaskular kaput), fraktur diafisis, osteoporosis."},"patela":{"desc":"Tulang sesamoid terbesar, tertanam di tendon kuadrisep femoris.","fn":"Meningkatkan daya ungkit ekstensi lutut dan melindungi sendi lutut.","nerve":"N. femoralis (rami kutaneus anterior), n. safenus.","blood":"Anastomosis genikular (a. poplitea dan a. femoralis).","rel":"Femur (permukaan patelar), tibia (via ligamen patela), tendon kuadrisep.","clin":"Fraktur patela, dislokasi patela, kondromalasia patela."},"tibia":{"desc":"Tulang tungkai bawah utama dengan kondilus di proksimal dan maleolus medial di distal.","fn":"Menyangga hampir seluruh berat badan tungkai bawah.","nerve":"N. tibialis, n. peroneus profundus.","blood":"A. tibialis anterior dan posterior, a. nutrisia tibia.","rel":"Femur, fibula, talus, ligamen patela.","clin":"Fraktur tibia terbuka (karena minim jaringan lunak), shin splints, sindrom kompartemen."},"fibula":{"desc":"Tulang ramping lateral tibia, dengan maleolus lateral di ujung distal.","fn":"Tempat melekat otot dan menstabilkan sendi pergelangan kaki; tidak menopang beban utama.","nerve":"N. peroneus komunis (melingkari kolum fibula).","blood":"A. peronea (fibularis).","rel":"Tibia (membran interoseus), talus, otot peroneus.","clin":"Fraktur maleolus lateral (Weber), cedera n. peroneus → foot drop."},"biceps":{"desc":"Otot dua kepala (caput longum dan breve) yang berinsersi di tuberositas radii dan aponeurosis bisipital.","fn":"Fleksi siku, supinasi lengan bawah, dan membantu fleksi bahu.","nerve":"N. muskulokutaneus (C5–C6).","blood":"A. brakialis dan cabang muskulernya.","rel":"Humerus, skapula (tuberkulum supraglenoid dan prosesus korakoideus), radius, otot brakialis.","clin":"Ruptur tendon caput longum (Popeye sign), tendinitis bisep."},"deltoid":{"desc":"Otot segitiga yang membentuk kontur bahu, dengan bagian anterior, lateral, dan posterior.","fn":"Abduksi lengan (15–90 derajat), fleksi dan ekstensi bahu sesuai bagiannya.","nerve":"N. aksilaris (C5–C6).","blood":"A. sirkumfleksa humeri posterior, a. torakoakromialis.","rel":"Klavikula, akromion, spina skapula, tuberositas deltoidea humerus.","clin":"Kelumpuhan akibat cedera n. aksilaris (fraktur kolum kirurgikum), tempat injeksi intramuskular."},"quadriceps":{"desc":"Empat kepala otot: rektus femoris, vastus lateralis, vastus medialis, vastus intermedius.","fn":"Ekstensi lutut; rektus femoris juga fleksi panggul.","nerve":"N. femoralis (L2–L4).","blood":"A. femoralis dan a. femoralis profunda.","rel":"Femur, patela, ligamen patela, tuberositas tibia.","clin":"Strain/ruptur kuadrisep, ruptur tendon, patellofemoral pain syndrome."},"medulla":{"desc":"Struktur silindris dengan 31 segmen yang menghasilkan 31 pasang saraf spinal. Berakhir sebagai konus medularis dan kauda ekuina.","fn":"Menghantarkan impuls sensorik naik dan motorik turun, serta mengatur refleks spinal.","nerve":"Saraf spinal (C1–Co1) melalui radiks dorsal dan ventral.","blood":"A. spinalis anterior (1) dan posterior (2), a. radikularis magna (Adamkiewicz).","rel":"Vertebra, meningen, LCS, otak (via batang otak).","clin":"Cedera medula spinalis, sindrom kauda ekuina, pungsi lumbal (di bawah L3 untuk menghindari medula)."},"median":{"desc":"Cabang pleksus brakialis (C5–T1) yang turun di lengan dan melewati terowongan karpal.","fn":"Fleksi pergelangan dan jari, pronasi, serta sensasi ibu jari hingga jari manis sisi radial.","nerve":"Berasal dari fasikulus lateral dan medial pleksus brakialis.","blood":"A. interoseus anterior, a. medianus.","rel":"A. brakialis, retinakulum fleksor, tendon fleksor jari.","clin":"Sindrom terowongan karpal, kelumpuhan tangan benediction."},"ischiadicus":{"desc":"Saraf terbesar dan terpanjang di tubuh (L4–S3), bercabang menjadi n. tibialis dan n. peroneus komunis di fossa poplitea.","fn":"Persarafan otot hamstring dan seluruh otot tungkai bawah serta kaki; sensasi tungkai bawah dan kaki.","nerve":"Pleksus sakralis (L4–S3).","blood":"A. gluteus inferior (a. comitans nervi ischiadici).","rel":"Otot piriformis, os coxae, femur, otot hamstring.","clin":"Iskialgia, sindrom piriformis, cedera akibat injeksi gluteal yang salah."},"frontal":{"desc":"Membentuk dahi, atap rongga mata, dan bagian depan dasar tengkorak; berongga oleh sinus frontalis.","fn":"Melindungi lobus frontal otak dan membentuk atap orbita.","nerve":"N. supraorbitalis dan n. supratrochlearis (cabang V1).","blood":"A. supraorbitalis, a. supratrochlearis, cabang a. meningea media.","rel":"Os parietale (sutura koronalis), sfenoid, etmoid, nasal, zigomatik, maksila.","clin":"Fraktur depresi dahi, sinusitis frontalis, hematoma epidural."},"parietal":{"desc":"Tulang pipih persegi yang membentuk atap dan sisi tengkorak.","fn":"Melindungi otak; permukaan dalamnya beralur oleh a. meningea media.","nerve":"Cabang n. trigeminus (V) untuk periosteum dan dura; n. oksipitalis mayor di tepi belakang.","blood":"A. meningea media dan a. temporalis superfisialis.","rel":"Frontal (sutura koronalis), parietal kontralateral (sagitalis), oksipital (lambdoidea), temporal.","clin":"Fraktur parietal dengan hematoma epidural, kraniosinostosis (skafosefali)."},"occipital":{"desc":"Membentuk dasar dan belakang tengkorak; memiliki foramen magnum dan kondilus oksipital.","fn":"Melindungi serebelum dan batang otak; bersendi dengan atlas (C1).","nerve":"N. oksipitalis mayor dan minor; n. hipoglosus (XII) lewat kanalis hipoglosi.","blood":"A. oksipitalis, a. meningea posterior, a. vertebralis (melalui foramen magnum).","rel":"Atlas (sendi atlanto-oksipital), parietal, temporal, sfenoid.","clin":"Fraktur basis kranii posterior, herniasi tonsil serebelum, malformasi Chiari."},"temporal":{"desc":"Terdiri dari pars skuamosa, petrosa, timpanika, dan mastoid, dengan prosesus stiloideus dan zigomatikus.","fn":"Rumah telinga tengah dan dalam, sendi temporomandibular, dan pelindung lobus temporal.","nerve":"N. fasialis (VII) dan n. vestibulokoklearis (VIII) melalui pars petrosa; n. aurikulotemporalis.","blood":"A. temporalis superfisialis, a. aurikularis posterior, a. stilomastoidea, a. meningea media.","rel":"Mandibula (TMJ), zigomatik, parietal, oksipital, sfenoid, telinga.","clin":"Fraktur os temporale (paresis fasialis, hemotimpanum), mastoiditis, pterion rentan mengenai a. meningea media."},"sphenoid":{"desc":"Tulang tengah dasar tengkorak berbentuk kelelawar: korpus, ala mayor dan minor, prosesus pterigoideus, sela tursika.","fn":"Menopang hipofisis, membentuk dinding orbita, dan jalur banyak saraf kranial.","nerve":"N. II (foramen opticum); III, IV, V1, VI (fissura orbitalis superior); V2 (foramen rotundum); V3 (foramen ovale).","blood":"A. meningea media (foramen spinosum), cabang a. maksilaris dan a. karotis interna.","rel":"Semua tulang kranium, vomer, palatum, zigomatik; sinus kavernosus.","clin":"Tumor hipofisis menekan kiasma optikum (hemianopsia bitemporal), fraktur basis kranii, sinusitis sfenoid."},"ethmoid":{"desc":"Tulang spons ringan di antara orbita: lamina kribrosa, krista galli, lamina perpendikularis, dan labirin etmoid.","fn":"Membentuk bagian atas septum nasi, dinding medial orbita, dan sel udara etmoid.","nerve":"N. olfaktorius (I) menembus lamina kribrosa; n. etmoidalis anterior dan posterior (V1).","blood":"A. etmoidalis anterior dan posterior (cabang a. oftalmika).","rel":"Frontal, sfenoid, vomer, maksila, lakrimal, konka inferior.","clin":"Fraktur lamina kribrosa (rinore LCS, anosmia), etmoiditis, selulitis orbita."},"ethcells":{"desc":"Rongga udara kecil di labirin etmoid (anterior, tengah, posterior).","fn":"Meringankan tengkorak dan menghangatkan udara napas; bagian sinus paranasal.","nerve":"N. etmoidalis anterior dan posterior (V1).","blood":"A. etmoidalis anterior dan posterior.","rel":"Meatus nasi media (sel anterior dan tengah), meatus superior (posterior); lamina papirasea.","clin":"Etmoiditis, penyebaran infeksi ke orbita melalui lamina papirasea."},"sinus":{"desc":"Rongga berisi udara berlapis mukosa di dalam tulang (frontal atau sfenoid).","fn":"Meringankan tengkorak, resonansi suara, melembabkan udara.","nerve":"Frontal: n. supraorbitalis (V1); sfenoid: n. etmoidalis posterior dan V2.","blood":"Frontal: a. supraorbitalis dan etmoidalis; sfenoid: cabang a. faringea dan etmoidalis posterior.","rel":"Sinus frontal bermuara ke meatus media; sinus sfenoid ke resesus sfenoetmoidal.","clin":"Sinusitis akut atau kronis, mukokel, komplikasi ke orbita dan otak."},"nasal":{"desc":"Dua tulang kecil berbentuk persegi yang membentuk batang hidung.","fn":"Menopang jembatan hidung dan melindungi rongga hidung bagian atas.","nerve":"N. infratrochlearis dan n. etmoidalis anterior (cabang nasal eksternal).","blood":"A. dorsalis nasi, a. angularis, a. etmoidalis anterior.","rel":"Frontal, maksila (prosesus frontalis), etmoid, tulang rawan septum dan alar.","clin":"Fraktur hidung (cedera wajah tersering), deviasi septum."},"lacrimal":{"desc":"Tulang tipis seukuran kuku di dinding medial orbita dengan fossa kantung lakrimal.","fn":"Membentuk jalur duktus nasolakrimalis.","nerve":"N. infratrochlearis dan n. lakrimalis (V1).","blood":"Cabang a. oftalmika dan a. infraorbitalis.","rel":"Maksila, frontal, etmoid (lamina papirasea), konka inferior.","clin":"Obstruksi duktus nasolakrimalis, dakriosistitis."},"maxilla":{"desc":"Tulang rahang atas berpasangan: korpus (dengan sinus maksilaris), prosesus frontalis, zigomatikus, alveolaris, dan palatinus.","fn":"Menopang gigi atas, membentuk dasar orbita, sebagian hidung, dan langit-langit keras.","nerve":"N. maksilaris (V2): n. infraorbitalis, n. alveolaris superior, n. nasopalatinus.","blood":"A. maksilaris (a. infraorbitalis, a. alveolaris superior), a. palatina mayor.","rel":"Zigomatik, nasal, frontal, etmoid, palatinum, vomer, konka inferior.","clin":"Fraktur Le Fort I–III, sinusitis maksilaris, celah langit-langit."},"palatine":{"desc":"Tulang berbentuk L di belakang maksila, dengan lempeng horizontal dan perpendikular.","fn":"Membentuk bagian belakang langit-langit keras dan dinding lateral hidung.","nerve":"N. palatina mayor dan minor (V2).","blood":"A. palatina desendens (cabang a. maksilaris), a. sfenopalatina.","rel":"Maksila, sfenoid (prosesus pterigoideus), vomer, etmoid.","clin":"Celah langit-langit, fraktur Le Fort."},"zygomatic":{"desc":"Tulang pipi yang membentuk tonjolan pipi dan sebagian dinding lateral orbita.","fn":"Membentuk kontur wajah dan arkus zigomatik; tempat melekat otot masseter.","nerve":"N. zigomatikofasialis dan zigomatikotemporalis (V2).","blood":"A. transversa fasialis, a. zigomatikoorbitalis.","rel":"Frontal, maksila, temporal (arkus zigomatik), sfenoid.","clin":"Fraktur tripod zigomatikomaksilar, kebas pipi akibat cedera n. infraorbitalis."},"vomer":{"desc":"Tulang pipih tipis di garis tengah rongga hidung.","fn":"Membentuk bagian bawah belakang septum nasi.","nerve":"N. nasopalatinus (V2).","blood":"A. sfenopalatina (cabang septal posterior), a. etmoidalis.","rel":"Etmoid (lamina perpendikularis), sfenoid, maksila, palatinum, tulang rawan septum.","clin":"Deviasi septum, epistaksis dari pleksus Kiesselbach."},"concha":{"desc":"Tulang melengkung tipis di dinding lateral rongga hidung bagian bawah.","fn":"Memperluas permukaan mukosa untuk menghangatkan dan melembabkan udara napas.","nerve":"N. nasalis posterior inferior (V2), n. palatina mayor.","blood":"A. sfenopalatina dan a. palatina desendens.","rel":"Maksila, palatinum, lakrimal, etmoid; meatus nasi inferior.","clin":"Hipertrofi konka (hidung tersumbat), epistaksis."},"hyoid":{"desc":"Tulang berbentuk U di leher, satu-satunya tulang yang tidak bersendi dengan tulang lain.","fn":"Menopang lidah dan laring, tempat melekat otot suprahioid dan infrahioid, membantu menelan.","nerve":"N. hipoglosus (XII), ansa servikalis, n. mandibularis (V3), n. fasialis (VII).","blood":"A. lingualis dan a. tiroidea superior.","rel":"Laring (membran tirohioid), lidah, mandibula, otot suprahioid dan infrahioid.","clin":"Fraktur hioid (sering pada pencekikan), sindrom Eagle."},"ossicle":{"desc":"Tulang pendengaran terkecil (maleus, inkus, stapes) di telinga tengah.","fn":"Menghantarkan getaran dari membran timpani ke telinga dalam.","nerve":"N. stapedius (cabang VII), n. tensor timpani (V3), korda timpani (VII).","blood":"A. timpanika anterior, a. stilomastoidea, a. timpanika inferior.","rel":"Membran timpani, jendela oval, otot stapedius dan tensor timpani.","clin":"Otosklerosis (stapes terfiksasi), diskontinuitas osikular, tuli konduktif."},"vert_c":{"desc":"Ruas servikal (C3–C7) kecil dengan foramen transversarium dan prosesus spinosus bercabang dua (C3–C6).","fn":"Menopang kepala, memberi gerak leher, melindungi medula spinalis dan a. vertebralis.","nerve":"Rami dorsal dan ventral saraf spinal servikal; pleksus servikalis dan brakialis.","blood":"A. vertebralis (melalui foramen transversarium), a. servikalis asendens.","rel":"Diskus intervertebralis, ligamen longitudinal, otot leher.","clin":"Whiplash, spondilosis servikal, radikulopati, fraktur dan dislokasi faset."},"vert_t":{"desc":"Ruas torakal (T1–T12) dengan faset kosta untuk bersendi dengan rusuk dan prosesus spinosus panjang miring ke bawah.","fn":"Menopang rongga dada, tempat melekat rusuk, melindungi medula spinalis.","nerve":"Rami dorsal dan ventral saraf spinal torakal (n. interkostalis).","blood":"A. interkostalis posterior dan a. subkostalis.","rel":"Rusuk (sendi kostovertebral), diskus, otot erector spinae.","clin":"Fraktur kompresi osteoporotik, skoliosis, kifosis (penyakit Scheuermann)."},"vert_l":{"desc":"Ruas lumbal (L1–L5) terbesar dengan korpus tebal dan prosesus mamilar.","fn":"Menahan beban terbesar tubuh bagian atas; memungkinkan fleksi-ekstensi batang tubuh.","nerve":"Rami dorsal dan ventral saraf spinal lumbal (pleksus lumbalis).","blood":"A. lumbalis dan a. iliolumbalis.","rel":"Diskus intervertebralis, sakrum (L5–S1), otot psoas, ligamen iliolumbal.","clin":"HNP L4–L5 dan L5–S1, stenosis kanalis, spondilolistesis, nyeri punggung bawah."},"atlas":{"desc":"Vertebra C1 berbentuk cincin tanpa korpus, dengan massa lateral dan arkus anterior dan posterior.","fn":"Menopang tengkorak (sendi atlanto-oksipital, gerak mengangguk).","nerve":"N. suboksipitalis (ramus dorsal C1).","blood":"A. vertebralis (melingkar di sulkus arteri vertebralis).","rel":"Tulang oksipital, aksis (dens), ligamen transversum atlantis.","clin":"Fraktur Jefferson, instabilitas atlantoaksial (misalnya pada artritis reumatoid)."},"axis":{"desc":"Vertebra C2 dengan dens (prosesus odontoideus) yang menonjol ke atas.","fn":"Poros rotasi kepala (menggeleng) bersama atlas.","nerve":"N. oksipitalis mayor (ramus dorsal C2).","blood":"A. vertebralis dan a. servikalis profunda.","rel":"Atlas (sendi atlantoaksial median), ligamen alar dan apikal, vertebra C3.","clin":"Fraktur dens, fraktur hangman (spondilolistesis traumatik C2)."},"sacrum":{"desc":"Lima vertebra sakral menyatu membentuk tulang segitiga di belakang panggul.","fn":"Menyalurkan beban tulang belakang ke panggul dan membentuk dinding belakang rongga pelvis.","nerve":"Rami ventral dan dorsal S1–S4 melalui foramen sakral; pleksus sakralis.","blood":"A. sakralis lateralis dan mediana, a. iliolumbalis.","rel":"L5, koksigis, tulang panggul (sendi sakroiliaka).","clin":"Nyeri sendi sakroiliaka, fraktur sakrum (cedera saraf), spina bifida okulta."},"coccyx":{"desc":"Tiga hingga lima vertebra koksigeal kecil menyatu di ujung kolumna vertebralis.","fn":"Tempat melekat otot dasar panggul dan ligamen; menopang saat duduk condong ke belakang.","nerve":"N. anokoksigeus (S4–S5, Co1).","blood":"A. sakralis mediana dan a. glutea inferior.","rel":"Sakrum (sendi sakrokoksigeal), levator ani, gluteus maksimus.","clin":"Koksidinia (nyeri tulang ekor), fraktur akibat jatuh terduduk."},"rib_typ":{"desc":"Rusuk tipikal (ke-3 sampai 9) dengan kaput, kolum, tuberkel, angulus, dan korpus beralur kostal.","fn":"Membentuk sangkar toraks, melindungi organ dada, dan menggerakkan napas.","nerve":"N. interkostalis (ramus ventral T3–T9).","blood":"A. interkostalis posterior dan anterior (a. torakika interna).","rel":"Vertebra torakal (sendi kostovertebral), kartilago kosta, otot interkostal, pleura.","clin":"Fraktur rusuk (tersering rusuk 4–9), flail chest, pneumotoraks."},"rib_atyp":{"desc":"Rusuk atipikal (ke-1, 2, 10, 11, 12): bentuk khas, rusuk 11–12 melayang; rusuk 1 pipih dengan alur a. subklavia.","fn":"Melindungi puncak paru (rusuk 1), tempat melekat otot skalenus dan serratus.","nerve":"N. interkostalis; di dekat rusuk 1 melintas akar C8–T1 pleksus brakialis.","blood":"A. interkostalis suprema (rusuk 1–2), a. interkostalis posterior, a. subkostalis (rusuk 12).","rel":"Vertebra torakal, otot skalenus, serratus anterior, diafragma, ginjal (rusuk 11–12).","clin":"Fraktur rusuk 1 (trauma berat, risiko cedera pembuluh), rusuk servikal, sindrom outlet toraks."},"costcart":{"desc":"Tulang rawan hialin yang menghubungkan ujung depan rusuk ke sternum atau ke tulang rawan di atasnya.","fn":"Memberi kelenturan dinding dada saat bernapas.","nerve":"N. interkostalis (T1–T11).","blood":"A. torakika interna dan a. interkostalis anterior.","rel":"Rusuk, sternum (rusuk 1–7), tulang rawan rusuk di atasnya (8–10).","clin":"Kostokondritis (sindrom Tietze), subluksasi kostokondral."},"scaphoid":{"desc":"Karpal terbesar baris proksimal, berbentuk perahu, di sisi radial pergelangan.","fn":"Menghubungkan baris karpal proksimal dan distal, menopang gerak pergelangan.","nerve":"N. medianus dan n. radialis (cabang interoseus).","blood":"A. radialis (cabang karpal dorsal dan palmar), aliran masuk dari distal.","rel":"Radius, lunatum, kapitatum, trapezium, trapezoid; dasar anatomical snuffbox.","clin":"Fraktur skafoid (karpal tersering patah), risiko nekrosis avaskular kutub proksimal."},"lunate":{"desc":"Karpal berbentuk bulan sabit di tengah baris proksimal.","fn":"Menyalurkan gaya dari kapitatum ke radius.","nerve":"N. interoseus anterior (medianus) dan posterior (radialis).","blood":"Cabang volar dan dorsal a. radialis, a. ulnaris, a. interoseus anterior.","rel":"Radius, skafoid, triketrum, kapitatum, hamatum.","clin":"Dislokasi lunatum (menekan n. medianus), penyakit Kienböck (nekrosis avaskular)."},"triquetrum":{"desc":"Karpal berbentuk piramida di sisi ulnar baris proksimal.","fn":"Menahan gaya ulnar pergelangan dan bersendi dengan pisiformis.","nerve":"N. ulnaris (ramus dorsal) dan n. interoseus posterior.","blood":"A. ulnaris, a. interoseus anterior, cabang karpal dorsal.","rel":"Lunatum, pisiformis, hamatum, kompleks fibrokartilago triangularis.","clin":"Fraktur avulsi dorsal triketrum (jatuh dengan tangan terentang)."},"pisiform":{"desc":"Tulang sesamoid kecil berbentuk kacang polong di tendon fleksor karpi ulnaris.","fn":"Menambah daya ungkit fleksor karpi ulnaris dan membentuk dinding kanalis Guyon.","nerve":"N. ulnaris (ramus profundus).","blood":"A. ulnaris.","rel":"Triketrum, hamatum (ligamen pisohamatum), tendon fleksor karpi ulnaris.","clin":"Fraktur pisiformis, neuropati ulnaris di kanalis Guyon."},"trapezium":{"desc":"Karpal baris distal sisi radial yang bersendi dengan metakarpal 1 (sendi pelana).","fn":"Memungkinkan gerak ibu jari, terutama oposisi.","nerve":"N. medianus (cabang tenar) dan n. radialis superfisialis.","blood":"A. radialis (cabang karpal palmar dan dorsal).","rel":"Metakarpal 1 dan 2, skafoid, trapezoid; tuberkel untuk retinakulum fleksor.","clin":"Osteoartritis sendi karpometakarpal 1, fraktur trapezium."},"trapezoid":{"desc":"Karpal kecil berbentuk baji di baris distal, antara trapezium dan kapitatum.","fn":"Menopang metakarpal 2 dan menstabilkan pergelangan.","nerve":"N. interoseus posterior dan n. medianus.","blood":"Cabang karpal dorsal dan palmar a. radialis.","rel":"Metakarpal 2, trapezium, kapitatum, skafoid.","clin":"Cedera terisolasi jarang; nyeri dasar jari telunjuk setelah trauma."},"capitate":{"desc":"Karpal terbesar, di tengah baris distal, dengan kaput yang bersendi dengan lunatum.","fn":"Poros mekanik pergelangan dan menopang metakarpal 3.","nerve":"N. interoseus posterior (radialis) dan cabang profunda n. ulnaris.","blood":"A. radialis dan a. interoseus anterior (cabang karpal).","rel":"Lunatum, skafoid, hamatum, trapezoid, metakarpal 2–4.","clin":"Fraktur kapitatum (kutub proksimal berisiko nekrosis avaskular), dislokasi perilunat."},"hamate":{"desc":"Karpal baji di sisi ulnar baris distal dengan hamulus (kait) di sisi palmar.","fn":"Menopang metakarpal 4–5; membentuk dinding kanalis Guyon dan terowongan karpal.","nerve":"Ramus profundus n. ulnaris (berjalan dekat hamulus).","blood":"A. ulnaris (cabang profunda).","rel":"Triketrum, kapitatum, metakarpal 4–5, pisiformis (via ligamen).","clin":"Fraktur hamulus (olahraga raket dan golf), cedera ramus profundus ulnaris."},"metacarpal":{"desc":"Lima tulang panjang telapak tangan dengan basis, korpus, dan kaput.","fn":"Membentuk kerangka telapak tangan dan titik tumpu genggaman.","nerve":"N. medianus (sisi radial) dan n. ulnaris (jari 4–5, otot interosei).","blood":"Arkus palmaris profunda dan superfisialis, aa. metakarpalis.","rel":"Karpal distal, falang proksimal (sendi MCP), otot interosei dan lumbrikal.","clin":"Fraktur boxer (metakarpal 5), fraktur Bennett (basis metakarpal 1)."},"phal_hand":{"desc":"Tulang jari tangan: proksimal, tengah (tidak ada pada ibu jari), dan distal.","fn":"Memungkinkan fleksi, ekstensi jari, dan genggaman halus.","nerve":"Nn. digitales palmares proprii (n. medianus dan n. ulnaris).","blood":"Aa. digitales palmares proprii dari arkus palmaris.","rel":"Metakarpal (sendi MCP), sendi PIP dan DIP, tendon fleksor dan ekstensor.","clin":"Fraktur falang, mallet finger, dislokasi PIP, trigger finger."},"talus":{"desc":"Tulang yang bersendi dengan tibia dan fibula, tanpa perlekatan otot dan hampir seluruhnya tertutup tulang rawan.","fn":"Menyalurkan berat badan dari tungkai bawah ke kaki.","nerve":"N. tibialis dan n. peroneus profundus.","blood":"A. tibialis posterior dan a. dorsalis pedis; suplai darah terbatas.","rel":"Tibia, fibula (mortise), kalkaneus, navikular.","clin":"Fraktur kolum talus (nekrosis avaskular), cedera pergelangan kaki."},"calcaneus":{"desc":"Tulang terbesar kaki yang membentuk tumit; sustentakulum tali menopang talus.","fn":"Menopang berat badan saat berdiri dan tempat melekat tendon Achilles.","nerve":"N. plantaris medialis dan lateralis, n. suralis.","blood":"A. tibialis posterior (cabang kalkaneus) dan a. peronea.","rel":"Talus, kuboid, tendon Achilles, fasia plantaris.","clin":"Fraktur kalkaneus (jatuh dari ketinggian), fasciitis plantaris (taji tumit), penyakit Sever."},"navicular":{"desc":"Tulang berbentuk perahu di sisi medial kaki, di depan talus.","fn":"Menopang lengkung longitudinal medial dan kepala talus.","nerve":"N. tibialis dan n. peroneus profundus.","blood":"A. dorsalis pedis dan a. plantaris medialis.","rel":"Talus, tiga kuneiformis, kuboid, tendon tibialis posterior.","clin":"Fraktur stres navikular (atlet), sindrom navikular aksesori."},"cuboid":{"desc":"Tulang kuboid di sisi lateral kaki dengan alur untuk tendon peroneus longus.","fn":"Menopang lengkung lateral dan metatarsal 4–5.","nerve":"N. plantaris lateralis dan n. suralis.","blood":"A. plantaris lateralis dan a. tarsalis lateralis.","rel":"Kalkaneus, navikular, kuneiformis lateral, metatarsal 4–5.","clin":"Sindrom kuboid (nyeri sisi lateral), fraktur kuboid."},"cuneiform":{"desc":"Tiga tulang baji (medial, intermedial, lateral) di depan navikular.","fn":"Membentuk lengkung transversal kaki dan menopang metatarsal 1–3.","nerve":"N. peroneus profundus dan n. plantaris medialis dan lateralis.","blood":"A. dorsalis pedis dan a. plantaris medialis.","rel":"Navikular, metatarsal 1–3, kuboid; tendon tibialis anterior dan posterior.","clin":"Cedera Lisfranc (sendi tarsometatarsal), pes planus."},"metatarsal":{"desc":"Lima tulang panjang telapak kaki dengan basis, korpus, dan kaput.","fn":"Membentuk lengkung depan kaki dan tumpuan saat mendorong tubuh berjalan.","nerve":"N. plantaris medialis dan lateralis, n. peroneus profundus.","blood":"Arkus plantaris, a. metatarsalis dorsalis dan plantaris.","rel":"Tarsal distal, falang proksimal (sendi MTP), otot interosei.","clin":"Fraktur Jones (basis metatarsal 5), fraktur stres (march fracture), hallux valgus."},"phal_foot":{"desc":"Tulang jari kaki; ibu jari hanya memiliki dua ruas (proksimal dan distal).","fn":"Membantu keseimbangan dan dorongan saat melangkah.","nerve":"N. digitalis plantaris proprius (n. plantaris medialis dan lateralis).","blood":"A. digitalis plantaris dan dorsalis.","rel":"Metatarsal (sendi MTP), sendi interfalangeal, tendon fleksor dan ekstensor.","clin":"Fraktur falang (stub toe), hammertoe, kuku tumbuh ke dalam."},"sesamoid_foot":{"desc":"Dua tulang sesamoid kecil di bawah kaput metatarsal 1, dalam tendon fleksor hallucis brevis.","fn":"Menyerap tekanan di bawah pangkal ibu jari kaki dan menambah daya ungkit.","nerve":"N. plantaris medialis (n. digitalis plantaris proprius).","blood":"A. plantaris medialis dan arkus plantaris.","rel":"Metatarsal 1, tendon fleksor hallucis brevis, ligamen plantar.","clin":"Sesamoiditis, fraktur sesamoid, turf toe."},"incisor":{"desc":"Gigi depan berbentuk pahat untuk memotong makanan.","fn":"Memotong makanan dan membantu pengucapan.","nerve":"Atas: n. alveolaris superior anterior (V2); bawah: n. alveolaris inferior (V3).","blood":"A. alveolaris superior anterior; a. alveolaris inferior.","rel":"Gingiva, tulang alveolar, ligamen periodontal, bibir.","clin":"Karies, trauma gigi depan, avulsi."},"canine":{"desc":"Gigi taring runcing dengan akar terpanjang.","fn":"Merobek makanan dan menopang sudut mulut.","nerve":"N. alveolaris superior anterior (V2); n. alveolaris inferior (V3).","blood":"A. alveolaris superior anterior; a. alveolaris inferior.","rel":"Gingiva, tulang alveolar, ligamen periodontal.","clin":"Impaksi taring atas, abses periapikal."},"premolar":{"desc":"Gigi geraham kecil dengan dua kuspid.","fn":"Menyobek dan menggiling makanan.","nerve":"N. alveolaris superior media (V2); n. alveolaris inferior (V3).","blood":"A. alveolaris superior; a. alveolaris inferior.","rel":"Gingiva, tulang alveolar, sinus maksilaris (gigi atas).","clin":"Karies, ekstraksi untuk ortodonti, fraktur kuspid."},"molar":{"desc":"Gigi geraham besar dengan 4–5 kuspid dan 2–3 akar.","fn":"Menggiling makanan.","nerve":"N. alveolaris superior posterior (V2); n. alveolaris inferior (V3).","blood":"A. alveolaris superior posterior; a. alveolaris inferior.","rel":"Gingiva, sinus maksilaris (akar atas), kanalis mandibularis (akar bawah).","clin":"Karies, pulpitis, abses, perikoronitis (molar ketiga)."},"larynx_cart":{"desc":"Tulang rawan laring (tiroid, krikoid, aritenoid, kornikulata) yang menyusun kerangka laring.","fn":"Melindungi jalan napas dan mengatur pita suara untuk fonasi.","nerve":"N. laringeus superior dan n. laringeus rekuren (cabang vagus X).","blood":"A. tiroidea superior dan inferior (a. laringea).","rel":"Hioid, trakea, otot intrinsik laring, pita suara.","clin":"Fraktur laring, intubasi sulit, cedera n. laringeus rekuren (suara serak)."},"nasal_cart":{"desc":"Tulang rawan hialin penopang hidung (septum, alar mayor, prosesus lateral).","fn":"Menjaga bentuk hidung dan lubang hidung tetap terbuka.","nerve":"N. etmoidalis anterior dan n. infraorbitalis.","blood":"A. labialis superior, a. dorsalis nasi, a. etmoidalis anterior.","rel":"Tulang hidung, maksila, vomer, etmoid.","clin":"Hematoma septum, deviasi septum, rinoplasti."},"lobe_ra":{"desc":"Lobus atas paru kanan, di atas fisura horizontal dan oblik; mengandung segmen apikal, posterior, dan anterior.","fn":"Pertukaran gas: oksigenasi darah dan pelepasan CO₂.","nerve":"Pleksus pulmonalis: parasimpatis dari n. vagus (X), simpatis dari trunkus simpatikus T1–T4.","blood":"A. pulmonalis (darah kurang oksigen), v. pulmonalis (darah kaya oksigen), a. bronkialis (nutrisi paru).","rel":"Trakea dan bronkus utama kanan, pleura, lobus tengah, apeks paru di pangkal leher, a. dan v. subklavia.","clin":"Tuberkulosis apikal, tumor Pancoast (sindrom Horner), pneumonia lobaris."},"lobe_rm":{"desc":"Lobus tengah paru kanan yang kecil berbentuk baji, di antara fisura horizontal dan oblik; segmen lateral dan medial.","fn":"Pertukaran gas.","nerve":"Pleksus pulmonalis: parasimpatis dari n. vagus (X), simpatis dari trunkus simpatikus T1–T4.","blood":"A. pulmonalis (darah kurang oksigen), v. pulmonalis (darah kaya oksigen), a. bronkialis (nutrisi paru).","rel":"Atrium kanan jantung, lobus atas dan bawah kanan, diafragma, pleura.","clin":"Sindrom lobus tengah (atelektasis karena bronkus sempit tertekan), pneumonia lobaris."},"lobe_ri":{"desc":"Lobus bawah paru kanan, lobus terbesar paru kanan; segmen superior dan lima segmen basal.","fn":"Pertukaran gas; terutama berperan pada ventilasi saat posisi berdiri.","nerve":"Pleksus pulmonalis: parasimpatis dari n. vagus (X), simpatis dari trunkus simpatikus T1–T4.","blood":"A. pulmonalis (darah kurang oksigen), v. pulmonalis (darah kaya oksigen), a. bronkialis (nutrisi paru).","rel":"Diafragma, hati (di bawah), lobus tengah dan atas, pleura.","clin":"Pneumonia aspirasi, abses paru, efusi pleura (cairan terkumpul di basal)."},"lobe_ls":{"desc":"Lobus atas paru kiri, termasuk lingula yang setara lobus tengah kanan; segmen apikoposterior, anterior, lingular superior dan inferior.","fn":"Pertukaran gas.","nerve":"Pleksus pulmonalis: parasimpatis dari n. vagus (X), simpatis dari trunkus simpatikus T1–T4.","blood":"A. pulmonalis (darah kurang oksigen), v. pulmonalis (darah kaya oksigen), a. bronkialis (nutrisi paru).","rel":"Jantung (insisura kardiaka), arkus aorta, a. subklavia kiri, pleura.","clin":"Tuberkulosis, tumor paru, pneumonia lingula."},"lobe_li":{"desc":"Lobus bawah paru kiri; segmen superior dan basal (anteromedial, lateral, posterior).","fn":"Pertukaran gas.","nerve":"Pleksus pulmonalis: parasimpatis dari n. vagus (X), simpatis dari trunkus simpatikus T1–T4.","blood":"A. pulmonalis (darah kurang oksigen), v. pulmonalis (darah kaya oksigen), a. bronkialis (nutrisi paru).","rel":"Diafragma, lambung dan limpa (di bawah), lobus atas kiri, pleura.","clin":"Pneumonia lobus bawah, bronkiektasis, efusi pleura."},"trachea":{"desc":"Pipa fibrokartilago sekitar 10–12 cm dengan 16–20 cincin tulang rawan berbentuk C terbuka ke belakang; dari tulang rawan krikoid (C6) sampai karina (T4–T5).","fn":"Menyalurkan udara ke dan dari paru; mukosa bersilia membersihkan partikel (eskalator mukosiliar).","nerve":"N. vagus (X) dan n. laringeus rekuren (parasimpatis), trunkus simpatikus.","blood":"Cabang a. tiroidea inferior dan a. bronkialis.","rel":"Laring (atas), esofagus (belakang), kelenjar tiroid, arkus aorta, bronkus utama (bifurkasi di karina).","clin":"Intubasi dan trakeostomi, stenosis trakea, aspirasi benda asing, kompresi oleh goiter."},"bronchus_main":{"desc":"Cabang pertama trakea di karina; bronkus kanan lebih pendek, lebar, dan vertikal dibanding kiri. Bronkus intermedius adalah lanjutan bronkus utama kanan setelah cabang lobus atas.","fn":"Menyalurkan udara ke tiap paru.","nerve":"Pleksus pulmonalis: parasimpatis dari n. vagus (X), simpatis dari trunkus simpatikus T1–T4.","blood":"A. bronkialis (cabang aorta toraks), v. bronkialis.","rel":"Trakea, a. dan v. pulmonalis (hilus), arkus aorta (kiri), v. azigos (kanan).","clin":"Benda asing lebih sering masuk bronkus kanan, karsinoma bronkogenik, bronkoskopi."},"bronchus_lobar":{"desc":"Cabang bronkus utama menuju tiap lobus (3 di kanan, 2 di kiri).","fn":"Menyalurkan udara ke satu lobus paru.","nerve":"Pleksus pulmonalis: parasimpatis dari n. vagus (X), simpatis dari trunkus simpatikus T1–T4.","blood":"A. bronkialis.","rel":"Bronkus utama, bronkus segmental, a. pulmonalis lobar.","clin":"Obstruksi menyebabkan atelektasis lobar, tumor endobronkial."},"bronchus_segmental":{"desc":"Bronkus tersier yang memasok satu segmen bronkopulmonal (10 di kanan, 8–10 di kiri); tiap segmen punya arteri sendiri dan dipisah septum jaringan ikat.","fn":"Menyalurkan udara ke satu segmen paru.","nerve":"Pleksus pulmonalis: parasimpatis dari n. vagus (X), simpatis dari trunkus simpatikus T1–T4.","blood":"A. bronkialis, cabang segmental a. pulmonalis.","rel":"Bronkus lobaris, bronkiolus, cabang a. pulmonalis segmental.","clin":"Segmentektomi, aspirasi (segmen posterior lobus atas dan superior lobus bawah saat telentang), bronkiektasis."},"epiglottis":{"desc":"Tulang rawan elastis berbentuk daun di belakang pangkal lidah, di atas pintu masuk laring.","fn":"Menutup aditus laringis saat menelan agar makanan tidak masuk jalan napas.","nerve":"N. laringeus superior (ramus internus, cabang X); sensasi valekula dari n. glosofaringeus (IX).","blood":"A. laringea superior (cabang a. tiroidea superior).","rel":"Hioid (ligamen hioepiglotik), pangkal lidah, valekula, tulang rawan tiroid.","clin":"Epiglotitis (darurat jalan napas), aspirasi."},"nasopharynx":{"desc":"Bagian atas faring di belakang rongga hidung dan di atas palatum molle; mengandung muara tuba Eustachius dan tonsil faringeal (adenoid).","fn":"Jalur udara dari hidung ke orofaring dan penyeimbang tekanan telinga tengah.","nerve":"Pleksus faringeal (IX dan X); sensasi dari n. maksilaris (V2).","blood":"A. faringea asendens, a. palatina asendens, cabang a. maksilaris.","rel":"Koana, tuba auditiva, atap sfenoid, orofaring, palatum molle.","clin":"Adenoid hipertrofi, otitis media, karsinoma nasofaring."},"oropharynx":{"desc":"Bagian tengah faring dari palatum molle sampai tepi atas epiglotis; tempat tonsil palatina dan tonsil lingual.","fn":"Jalur bersama udara dan makanan.","nerve":"N. glosofaringeus (IX) untuk sensasi dan refleks muntah; n. vagus (X) untuk motorik.","blood":"A. tonsilaris, a. faringea asendens, a. lingualis dorsalis.","rel":"Rongga mulut (isthmus fausium), nasofaring, laringofaring, tonsil palatina.","clin":"Tonsilitis, abses peritonsilar, karsinoma orofaring."},"laryngopharynx":{"desc":"Bagian bawah faring dari tepi atas epiglotis sampai tulang rawan krikoid, menyempit menjadi esofagus; memiliki resesus piriformis.","fn":"Jalur menelan; makanan lewat di kanan dan kiri laring.","nerve":"N. laringeus rekuren dan superior (X), pleksus faringeal.","blood":"A. tiroidea superior dan inferior, a. faringea asendens.","rel":"Laring (depan), esofagus (bawah), otot konstriktor faring.","clin":"Benda asing tersangkut di resesus piriformis, karsinoma hipofaring."},"nasal_mucosa":{"desc":"Lapisan mukosa rongga hidung: epitel respirasi bersilia, dan epitel olfaktorius di atap.","fn":"Menghangatkan, melembabkan, menyaring udara, dan mendeteksi bau.","nerve":"N. olfaktorius (I) untuk bau; n. trigeminus (V1, V2) untuk sensasi.","blood":"A. sfenopalatina, a. etmoidalis anterior dan posterior, a. labialis superior (pleksus Kiesselbach).","rel":"Konka nasalis, septum nasi, sinus paranasal, koana.","clin":"Epistaksis, rinitis alergi, polip nasal."},"pleura":{"desc":"Selaput serosa dua lapis (pleura parietal dan viseral) yang membungkus paru, dengan rongga pleura berisi cairan tipis.","fn":"Mengurangi gesekan saat bernapas dan menjaga tekanan negatif rongga pleura agar paru mengembang.","nerve":"Parietal: n. interkostalis dan n. frenikus (peka nyeri); viseral: pleksus pulmonalis (tidak peka nyeri).","blood":"Parietal: a. interkostalis dan a. torakika interna; viseral: a. bronkialis dan a. pulmonalis.","rel":"Paru, dinding dada, diafragma, mediastinum.","clin":"Pneumotoraks, efusi pleura, empiema, pleuritis, hemotoraks."},"diaphragm":{"desc":"Otot berbentuk kubah yang memisahkan rongga toraks dan abdomen; bagian sternal, kostal, dan lumbal, dengan hiatus untuk aorta, esofagus, dan v. kava inferior.","fn":"Otot utama inspirasi: berkontraksi mendatar sehingga volume toraks bertambah.","nerve":"N. frenikus (C3–C5); n. interkostalis bawah untuk sensasi tepi.","blood":"A. frenika superior dan inferior, a. perikardiakofrenika, a. muskulofrenika.","rel":"Paru dan pleura (atas), hati, lambung, limpa (bawah), rusuk 7–12, vertebra L1–L3.","clin":"Hernia hiatus, hernia diafragmatika kongenital, paresis diafragma (cedera n. frenikus), cegukan."},"palate":{"desc":"Palatum molle adalah bagian lunak langit-langit di belakang palatum durum; ujung bebasnya membentuk uvula.","fn":"Menutup nasofaring saat menelan dan berbicara agar makanan tidak masuk hidung.","nerve":"N. vagus (X) untuk otot (kecuali tensor veli palatini oleh V3); sensasi dari n. palatina minor (V2) dan IX.","blood":"A. palatina asendens, a. palatina desendens, a. faringea asendens.","rel":"Palatum durum, nasofaring, orofaring, tonsil palatina, lidah.","clin":"Celah langit-langit, sleep apnea, paresis palatum pada lesi vagus (uvula deviasi)."},"gingiva":{"desc":"Jaringan lunak mukosa yang mengelilingi leher gigi dan menutupi tulang alveolar.","fn":"Menyegel dan melindungi jaringan periodontal dan akar gigi.","nerve":"N. alveolaris superior (V2); n. alveolaris inferior, n. lingualis, n. bukalis (V3).","blood":"A. alveolaris superior dan inferior, a. palatina mayor, a. labialis.","rel":"Gigi, tulang alveolar, ligamen periodontal, bibir dan pipi.","clin":"Gingivitis, periodontitis, resesi gingiva, hiperplasia gusi akibat obat."},"tongue":{"desc":"Organ otot di dasar mulut dengan otot intrinsik dan ekstrinsik; permukaan atasnya ditutupi papila pengecap.","fn":"Mengecap, mengunyah, menelan, dan berbicara.","nerve":"Motorik: n. hipoglosus (XII); sensasi 2/3 depan: n. lingualis (V3), rasa: korda timpani (VII); 1/3 belakang: n. glosofaringeus (IX).","blood":"A. lingualis (cabang a. karotis eksterna).","rel":"Mandibula, tulang hioid, palatum, tonsil lingual, epiglotis.","clin":"Glositis, karsinoma sel skuamosa lidah, deviasi lidah pada lesi XII, makroglosia."},"parotid":{"desc":"Kelenjar ludah terbesar, di depan telinga dan di atas ramus mandibula; ditembus oleh n. fasialis.","fn":"Menghasilkan ludah serosa kaya amilase.","nerve":"Parasimpatis: n. glosofaringeus (IX) via ganglion otikum dan n. aurikulotemporalis; sensorik n. aurikularis magnus.","blood":"A. karotis eksterna dan cabangnya (a. temporalis superfisialis).","rel":"N. fasialis (pleksus parotis), ramus mandibula, otot masseter, v. retromandibularis.","clin":"Parotitis (gondongan), adenoma pleomorfik, batu kelenjar, cedera n. fasialis saat operasi."},"sublingual":{"desc":"Kelenjar ludah utama terkecil, di bawah lidah pada dasar mulut.","fn":"Menghasilkan ludah mukus.","nerve":"Parasimpatis: korda timpani (VII) via ganglion submandibula.","blood":"A. sublingualis dan a. submentalis.","rel":"Dasar mulut, mandibula, duktus submandibula, n. lingualis.","clin":"Ranula (kista mukus), batu kelenjar."},"submandibular":{"desc":"Kelenjar ludah di bawah mandibula; duktusnya (Wharton) bermuara di sisi frenulum lidah.","fn":"Menghasilkan ludah campuran serosa dan mukus (sekitar 70% ludah basal).","nerve":"Parasimpatis: korda timpani (VII) via ganglion submandibula.","blood":"A. fasialis dan a. lingualis.","rel":"Otot mylohyoid, n. lingualis, n. hipoglosus, a. fasialis.","clin":"Sialolitiasis (batu kelenjar, tersering di sini), sialadenitis."},"salivary_duct":{"desc":"Saluran yang membawa ludah ke rongga mulut: duktus parotis (Stensen) dan duktus submandibula (Wharton).","fn":"Menyalurkan ludah dari kelenjar ke mulut.","nerve":"Mengikuti kelenjar asal (parasimpatis IX untuk parotis, VII untuk submandibula).","blood":"Cabang a. karotis eksterna.","rel":"Pipi (otot bukinator) untuk duktus parotis; dasar mulut dan n. lingualis untuk duktus submandibula.","clin":"Sumbatan oleh batu, striktur, radang duktus."},"esophagus":{"desc":"Tabung otot sekitar 25 cm dari faring (setinggi C6), menembus diafragma di T10 menuju kardia lambung.","fn":"Menyalurkan makanan ke lambung dengan gerak peristaltik; sfingter atas dan bawah mencegah refluks.","nerve":"N. vagus (X) dan trunkus simpatikus; pleksus esofagus; n. laringeus rekuren untuk bagian atas.","blood":"A. tiroidea inferior (servikal), cabang aorta toraks (toraks), a. gastrika kiri dan a. frenika inferior (abdominal).","rel":"Trakea, aorta, atrium kiri, diafragma (hiatus esofagus), lambung.","clin":"GERD, esofagitis, akalasia, varises esofagus (hipertensi portal), karsinoma, hernia hiatus."},"stomach":{"desc":"Organ berbentuk J dengan kardia, fundus, korpus, antrum, dan pilorus; kelengkungan mayor dan minor.","fn":"Menyimpan dan mencerna makanan secara kimia (HCl, pepsin) dan mekanik; faktor intrinsik untuk vitamin B12.","nerve":"N. vagus (parasimpatis, merangsang sekresi dan gerak); pleksus seliakus (simpatis T6–T9).","blood":"A. gastrika kiri dan kanan, a. gastroepiploika kanan dan kiri, a. gastrika pendek.","rel":"Esofagus, duodenum, hati, pankreas, limpa, kolon transversum, diafragma, omentum.","clin":"Tukak lambung, gastritis (H. pylori), karsinoma lambung, stenosis pilorus."},"stomach_mucosa":{"desc":"Lapisan dalam lambung berlipat (rugae) dengan kelenjar penghasil asam dan pepsinogen.","fn":"Menyekresi HCl, pepsinogen, mukus, dan faktor intrinsik.","nerve":"N. vagus (X) dan pleksus mienterikus.","blood":"Cabang a. gastrika dan a. gastroepiploika.","rel":"Lapisan otot lambung, lumen lambung.","clin":"Gastritis, tukak, metaplasia intestinal, karsinoma lambung."},"duodenum":{"desc":"Bagian pertama usus halus sekitar 25 cm berbentuk C yang melingkari kepala pankreas; terdiri dari 4 bagian.","fn":"Menetralkan asam lambung, mencampur kimus dengan empedu dan enzim pankreas; tempat utama penyerapan zat besi.","nerve":"N. vagus (X); pleksus seliakus dan mesenterika superior (simpatis).","blood":"A. gastroduodenalis dan a. pankreatikoduodenalis superior (truncus coeliacus), a. pankreatikoduodenalis inferior (a. mesenterika superior).","rel":"Pilorus, pankreas, duktus koledokus (papila mayor), ginjal kanan, v. kava inferior.","clin":"Tukak duodenum, duodenitis, obstruksi, karsinoma kepala pankreas yang menekan duodenum."},"jejunum":{"desc":"Bagian usus halus setelah duodenum dengan lipatan sirkular (plica) yang tebal; pada atlas ini termasuk bagian usus halus berikutnya.","fn":"Penyerapan utama nutrien: karbohidrat, protein, lemak.","nerve":"N. vagus; pleksus mesenterika superior (simpatis T9–T10).","blood":"A. mesenterika superior (aa. jejunales), v. mesenterika superior.","rel":"Duodenum (fleksura duodenojejunalis), mesenterium, kolon transversum.","clin":"Penyakit Crohn, penyakit seliak, obstruksi usus halus, sindrom usus pendek."},"appendix":{"desc":"Tabung buntu kecil (sekitar 8–10 cm) yang menempel pada sekum di bawah katup ileosekal.","fn":"Mengandung jaringan limfoid; diduga reservoir flora usus.","nerve":"N. vagus dan pleksus mesenterika superior; nyeri visceral awal dirasakan di sekitar pusar (T10).","blood":"A. apendikularis (cabang a. ileokolika).","rel":"Sekum, ileum terminal, mesoapendiks; titik McBurney di permukaan kulit.","clin":"Apendisitis akut (nyeri berpindah ke kuadran kanan bawah), perforasi, apendektomi."},"colon_asc":{"desc":"Kolon naik di sisi kanan abdomen dari sekum ke fleksura hepatika; retroperitoneal.","fn":"Menyerap air dan elektrolit dari kimus cair.","nerve":"N. vagus dan pleksus mesenterika superior (simpatis).","blood":"A. ileokolika dan a. kolika kanan (a. mesenterika superior).","rel":"Sekum, ileum terminal, ginjal kanan, hati (fleksura hepatika), dinding abdomen.","clin":"Karsinoma kolon kanan, penyakit Crohn, intususepsi."},"colon_trans":{"desc":"Kolon yang melintang abdomen dari fleksura hepatika ke fleksura splenika; intraperitoneal dengan mesokolon transversum.","fn":"Penyerapan air dan pembentukan feses.","nerve":"N. vagus untuk 2/3 proksimal; saraf splanknik pelvis (S2–S4) untuk 1/3 distal.","blood":"A. kolika media (a. mesenterika superior), a. kolika kiri (a. mesenterika inferior).","rel":"Lambung dan omentum mayus (atas), usus halus, pankreas, limpa dan hati di kedua ujungnya.","clin":"Volvulus, karsinoma, megakolon toksik."},"colon_desc":{"desc":"Kolon turun di sisi kiri abdomen dari fleksura splenika ke fossa iliaka kiri; retroperitoneal.","fn":"Penyerapan air dan penyimpanan feses.","nerve":"Saraf splanknik pelvis (S2–S4); pleksus mesenterika inferior (simpatis L1–L2).","blood":"A. kolika kiri dan aa. sigmoid (a. mesenterika inferior).","rel":"Ginjal kiri, limpa, m. psoas, kolon sigmoid.","clin":"Divertikulosis dan divertikulitis, kolitis ulseratif, karsinoma kolon kiri."},"colon_sig":{"desc":"Segmen berbentuk S setelah kolon desendens menuju rektum; intraperitoneal dengan mesokolon sigmoid.","fn":"Penyimpanan feses dan pengaturan pengosongan.","nerve":"Saraf splanknik pelvis (S2–S4) dan pleksus hipogastrik inferior.","blood":"Aa. sigmoid dan a. rektalis superior (a. mesenterika inferior).","rel":"Kandung kemih, uterus atau prostat, ureter kiri, rektum.","clin":"Volvulus sigmoid, divertikulitis (tersering), karsinoma kolorektal."},"taenia":{"desc":"Tiga pita otot longitudinal (taenia libera, mesokolika, omentalis) pada dinding kolon yang membentuk haustra.","fn":"Memendekkan kolon dan membentuk kantung haustra untuk gerak segmentasi.","nerve":"Pleksus mienterikus; n. vagus dan saraf splanknik pelvis.","blood":"Aa. kolika (a. mesenterika superior dan inferior).","rel":"Sekum, kolon, apendiks (ketiga taenia bertemu di dasar apendiks), omentum.","clin":"Petunjuk bedah untuk menemukan apendiks; divertikel muncul di celah antar taenia."},"liver":{"desc":"Kelenjar terbesar tubuh (sekitar 1,5 kg) di kuadran kanan atas; lobus kanan, kiri, kaudatus, dan kuadratus; dibagi menjadi 8 segmen Couinaud.","fn":"Metabolisme nutrien, sintesis protein plasma dan faktor pembekuan, detoksifikasi, produksi empedu, penyimpanan glikogen dan vitamin.","nerve":"N. vagus, n. frenikus (kapsul), pleksus seliakus (simpatis T7–T10).","blood":"A. hepatika (sekitar 25%, beroksigen) dan v. porta (sekitar 75%, dari usus); keluar lewat vv. hepatika ke v. kava inferior.","rel":"Diafragma, lambung, kandung empedu, duodenum, ginjal kanan, v. kava inferior.","clin":"Hepatitis, sirosis, hipertensi portal, karsinoma hepatoseluler, perlemakan hati, laserasi hati."},"liver_seg":{"desc":"Segmen fungsional Couinaud (I–VIII); masing-masing punya cabang v. porta, a. hepatika, dan duktus empedu sendiri.","fn":"Memungkinkan reseksi hati per segmen tanpa mengganggu segmen lain.","nerve":"Pleksus hepatikus (n. vagus dan simpatis).","blood":"Cabang segmental a. hepatika dan v. porta; drainase oleh vv. hepatika.","rel":"Segmen lain, fisura dan ligamen falsiformis, v. porta, kandung empedu.","clin":"Hepatektomi segmental, lokalisasi tumor dan abses hati."},"gallbladder":{"desc":"Kantung berbentuk buah pir di bawah hati dengan fundus, korpus, infundibulum, dan leher (duktus sistikus).","fn":"Menyimpan dan memekatkan empedu; berkontraksi saat dirangsang CCK setelah makan berlemak.","nerve":"N. vagus (kontraksi), pleksus seliakus (simpatis), n. frenikus kanan (nyeri alih ke bahu).","blood":"A. sistika (cabang a. hepatika kanan); segitiga Calot.","rel":"Hati, duodenum, kolon transversum, duktus sistikus dan hepatikus.","clin":"Kolelitiasis (batu empedu), kolesistitis, kolik bilier, kolesistektomi."},"bile_duct":{"desc":"Duktus koledokus terbentuk dari penyatuan duktus sistikus dan duktus hepatikus komunis; bermuara di papila mayor duodenum.","fn":"Menyalurkan empedu ke duodenum; sfingter Oddi mengatur aliran.","nerve":"N. vagus dan pleksus seliakus.","blood":"A. sistika, a. hepatika kanan, a. gastroduodenalis, a. pankreatikoduodenalis superior.","rel":"Ligamentum hepatoduodenale (bersama v. porta dan a. hepatika), kepala pankreas, duodenum.","clin":"Koledokolitiasis, kolangitis, ikterus obstruktif, karsinoma kepala pankreas."},"pancreas":{"desc":"Kelenjar panjang di belakang lambung (retroperitoneal) dengan kepala, leher, korpus, dan ekor; eksokrin dan endokrin.","fn":"Eksokrin: enzim pencernaan dan bikarbonat; endokrin: insulin, glukagon, somatostatin (pulau Langerhans).","nerve":"N. vagus (sekresi) dan pleksus seliakus (simpatis).","blood":"A. splenika, a. pankreatikoduodenalis superior dan inferior; v. porta.","rel":"Duodenum (kepala), limpa (ekor), lambung, v. porta, aorta, v. kava inferior, ginjal kiri.","clin":"Pankreatitis akut dan kronis, karsinoma pankreas (kepala), diabetes melitus, pseudokista."},"pancreatic_duct":{"desc":"Duktus utama (Wirsung) menyatu dengan duktus koledokus di ampula Vater; duktus aksesori (Santorini) bermuara di papila minor.","fn":"Menyalurkan getah pankreas ke duodenum.","nerve":"N. vagus dan pleksus seliakus.","blood":"A. pankreatikoduodenalis dan a. splenika.","rel":"Parenkim pankreas, duktus koledokus, duodenum.","clin":"Batu duktus, pankreatitis, striktur, pankreas divisum."},"omentum_major":{"desc":"Lipatan peritoneum besar yang menggantung dari kelengkungan mayor lambung menutupi usus seperti celemek.","fn":"Menyimpan lemak, melindungi organ, dan melokalisasi infeksi.","nerve":"Pleksus seliakus (simpatis); saraf otonom yang menyertai pembuluh darah.","blood":"A. gastroepiploika kanan dan kiri.","rel":"Lambung, kolon transversum, usus halus, peritoneum.","clin":"Melokalisasi radang, torsi omentum, metastasis (omental cake)."},"omentum_minor":{"desc":"Lipatan peritoneum dari kelengkungan minor lambung dan duodenum proksimal ke hati; ligamen hepatogastrik dan hepatoduodenal.","fn":"Menopang lambung, membawa pembuluh ke hati, dan membatasi bursa omentalis.","nerve":"Pleksus seliakus dan n. vagus.","blood":"A. gastrika kanan dan kiri, a. hepatika, v. porta.","rel":"Hati, lambung, duodenum, foramen epiploikum (Winslow), duktus koledokus.","clin":"Manuver Pringle (menjepit ligamen hepatoduodenal), penyebaran tumor."},"mesocolon":{"desc":"Lipatan peritoneum yang menggantung kolon ke dinding abdomen posterior (mesokolon transversum dan sigmoid).","fn":"Membawa pembuluh darah, limfe, dan saraf ke kolon serta memberi mobilitas.","nerve":"Pleksus mesenterika superior dan inferior.","blood":"A. kolika media, kiri, dan aa. sigmoid.","rel":"Kolon transversum atau sigmoid, pankreas, duodenum, aorta.","clin":"Volvulus pada mesokolon panjang, hernia internal, kolektomi."},"mesoappendix":{"desc":"Lipatan peritoneum kecil berbentuk segitiga yang menggantung apendiks pada mesenterium ileum terminal.","fn":"Membawa a. apendikularis ke apendiks.","nerve":"Pleksus mesenterika superior.","blood":"A. apendikularis (cabang a. ileokolika).","rel":"Apendiks, ileum terminal, sekum.","clin":"Ligasi saat apendektomi; iskemia apendiks bila pembuluhnya tersumbat."},"testis":{"desc":"Gonad pria berpasangan berbentuk oval di dalam skrotum, dibungkus tunika albuginea dan tersusun dari tubulus seminiferus dan sel Leydig.","fn":"Spermatogenesis di tubulus seminiferus dan produksi testosteron oleh sel Leydig.","nerve":"Pleksus testikularis (simpatis T10–T11) dan ramus genital n. genitofemoralis; nyeri alih ke perut bawah.","blood":"A. testikularis (cabang aorta abdominal), a. kremaster, a. duktus deferens; v. testikularis (pleksus pampiniformis) bermuara ke v. kava inferior (kanan) dan v. renalis (kiri).","rel":"Epididimis, duktus deferens, funikulus spermatikus, skrotum, tunika vaginalis.","clin":"Torsio testis (darurat), kanker testis, varikokel (lebih sering sisi kiri), hidrokel, kriptorkismus."},"epididymis":{"desc":"Struktur melingkar di sisi belakang testis (kaput, korpus, kauda) tempat sperma matang dan disimpan.","fn":"Pematangan, penyimpanan, dan pengangkutan sperma menuju duktus deferens.","nerve":"Pleksus testikularis dan pleksus pelvikus (simpatis); n. ilioinguinalis dan n. genitofemoralis.","blood":"A. testikularis dan a. duktus deferens.","rel":"Testis, duktus deferens, funikulus spermatikus.","clin":"Epididimitis (nyeri skrotum akut), spermatokel, obstruksi pada infertilitas."},"deferens":{"desc":"Saluran otot tebal sekitar 45 cm dari kauda epididimis, melewati kanalis inguinalis, menyilang ureter, lalu membentuk ampula dan bergabung dengan duktus vesikula seminalis.","fn":"Mengangkut sperma ke duktus ejakulatorius saat ejakulasi lewat kontraksi peristaltik.","nerve":"Simpatis dari pleksus hipogastrik inferior (T10–L2).","blood":"A. duktus deferens (cabang a. vesikalis superior).","rel":"Funikulus spermatikus, kanalis inguinalis, ureter, kandung kemih, vesikula seminalis.","clin":"Vasektomi (pemotongan untuk sterilisasi), kelainan bawaan duktus deferens (pada fibrosis kistik)."},"ejaculatory":{"desc":"Saluran pendek sekitar 2 cm dari penyatuan duktus deferens dan duktus vesikula seminalis, menembus prostat dan bermuara di uretra prostatika.","fn":"Menyalurkan sperma dan cairan semen ke uretra saat ejakulasi.","nerve":"Pleksus hipogastrik inferior (simpatis dan parasimpatis S2–S4).","blood":"A. vesikalis inferior dan a. rektalis media.","rel":"Prostat, uretra prostatika (kolikulus seminalis), vesikula seminalis, duktus deferens.","clin":"Obstruksi duktus ejakulatorius (infertilitas), kista, prostatitis."},"seminal":{"desc":"Sepasang kelenjar berlekuk di belakang kandung kemih dan di atas prostat.","fn":"Menghasilkan sekitar 60–70% cairan semen (fruktosa, prostaglandin, fibrinogen).","nerve":"Simpatis dari pleksus hipogastrik inferior (L1–L2) untuk emisi.","blood":"A. vesikalis inferior dan a. rektalis media.","rel":"Kandung kemih, rektum, prostat, ampula duktus deferens.","clin":"Vesikulitis, kista, penyebaran kanker prostat ke vesikula seminalis."},"prostate":{"desc":"Kelenjar fibromuskular seukuran kenari yang mengelilingi uretra proksimal di bawah kandung kemih; zona perifer, transisi, dan sentral.","fn":"Menghasilkan cairan prostat (sekitar 20–30% semen) yang mengandung PSA dan membantu motilitas sperma.","nerve":"Pleksus prostatikus (simpatis T11–L2, parasimpatis S2–S4 lewat n. kavernosus).","blood":"A. vesikalis inferior, a. rektalis media, a. pudenda interna; pleksus vena prostatika.","rel":"Kandung kemih, uretra, vesikula seminalis, rektum (teraba saat colok dubur), simfisis pubis.","clin":"Hiperplasia prostat jinak (zona transisi), karsinoma prostat (zona perifer), prostatitis, pemeriksaan PSA."},"corp_cav":{"desc":"Dua badan silindris jaringan erektil di sisi punggung penis, dibungkus tunika albuginea.","fn":"Terisi darah saat ereksi sehingga penis menjadi kaku.","nerve":"Parasimpatis (n. kavernosus, S2–S4) merangsang ereksi; n. dorsalis penis (n. pudendus) untuk sensasi.","blood":"A. profunda penis dan a. dorsalis penis (cabang a. pudenda interna).","rel":"Korpus spongiosum, ramus pubis, otot iskiokavernosus, fasia Buck.","clin":"Disfungsi ereksi, penyakit Peyronie, priapismus, fraktur penis."},"corp_spong":{"desc":"Badan jaringan erektil tunggal di sisi bawah penis yang mengelilingi uretra; ujung depannya membesar menjadi glans.","fn":"Menjaga uretra tetap terbuka saat ereksi sehingga ejakulasi dapat lewat.","nerve":"N. kavernosus (parasimpatis) dan n. dorsalis penis.","blood":"A. bulbi penis dan a. uretralis (cabang a. pudenda interna).","rel":"Uretra spongiosa, korpus kavernosum, otot bulbospongiosus.","clin":"Cedera uretra bulbar (trauma straddle), priapismus, striktur uretra."},"glans":{"desc":"Ujung penis berbentuk kerucut, perluasan korpus spongiosum, ditutupi preputium; meatus uretra eksternus terbuka di ujungnya.","fn":"Daerah paling peka rangsang; saluran keluar urin dan semen.","nerve":"N. dorsalis penis (cabang n. pudendus, S2–S4).","blood":"A. dorsalis penis dan a. bulbi penis.","rel":"Korpus spongiosum, preputium, fossa navikularis uretra.","clin":"Balanitis, fimosis, parafimosis, hipospadia, karsinoma penis."},"urethra":{"desc":"Saluran urin dan semen pada pria sekitar 18–20 cm: bagian prostatika, membranosa, dan spongiosa.","fn":"Mengalirkan urin dari kandung kemih dan semen saat ejakulasi.","nerve":"Pleksus prostatikus; n. pudendus (sfingter eksternal volunter).","blood":"A. vesikalis inferior, a. rektalis media, a. pudenda interna (a. bulbi penis dan a. uretralis).","rel":"Prostat, diafragma urogenital, korpus spongiosum, kandung kemih.","clin":"Striktur uretra, uretritis, hipospadia, kerusakan akibat kateterisasi, BPH menekan uretra."},"kidney":{"desc":"Sepasang organ berbentuk kacang di ruang retroperitoneal setinggi T12–L3 (ginjal kanan sedikit lebih rendah); terdiri dari korteks, medula (piramid), kaliks, dan hilus; sekitar satu juta nefron per ginjal.","fn":"Menyaring darah dan membentuk urin, mengatur cairan, elektrolit, dan tekanan darah (renin), memproduksi eritropoietin, mengaktifkan vitamin D.","nerve":"Pleksus renalis (simpatis T10–L1); nyeri ginjal dirasakan di pinggang dan menjalar ke selangkangan.","blood":"A. renalis (cabang aorta abdominal, sekitar 20% curah jantung), a. segmentalis dan interlobaris; v. renalis ke v. kava inferior.","rel":"Kelenjar suprarenal (atas), hati (kanan), limpa (kiri), kolon, pankreas, otot psoas dan kuadratus lumborum, rusuk 11–12.","clin":"Batu ginjal, pielonefritis, gagal ginjal akut dan kronis, karsinoma sel ginjal, penyakit ginjal polikistik, hidronefrosis."},"renal_pelvis":{"desc":"Rongga berbentuk corong di hilus ginjal tempat bertemunya kaliks mayor dan minor, menyambung ke ureter.","fn":"Menampung urin dari kaliks dan menyalurkannya ke ureter.","nerve":"Pleksus renalis (simpatis dan serabut sensorik T10–L1).","blood":"A. renalis (cabang pelvis) dan a. ureterika.","rel":"Kaliks renalis, sinus renalis, pembuluh ginjal, ureter (sambungan ureteropelvik).","clin":"Hidronefrosis, batu di sambungan ureteropelvik (kolik ginjal), pielitis."},"ureter":{"desc":"Tabung otot sekitar 25 cm dari pelvis renalis ke kandung kemih; retroperitoneal, menyilang pembuluh iliaka dan di bawah a. uterina atau duktus deferens.","fn":"Menyalurkan urin ke kandung kemih dengan gerak peristaltik.","nerve":"Pleksus renalis, ureterikus, dan hipogastrik (simpatis T10–L2, parasimpatis S2–S4); nyeri kolik menjalar ke pinggang dan selangkangan.","blood":"A. renalis, a. gonadalis, cabang aorta, a. iliaka komunis, a. vesikalis inferior.","rel":"M. psoas, pembuluh iliaka dan gonadal, kandung kemih (muara ureter), duktus deferens pada pria.","clin":"Batu ureter pada tiga penyempitan (ureteropelvik, tepi pelvis, ureterovesikal), cedera ureter saat operasi pelvis, refluks vesikoureter."},"bladder":{"desc":"Kantung otot (detrusor) di belakang simfisis pubis dengan apeks, korpus, fundus, dan leher; trigonum vesika di dasarnya.","fn":"Menampung urin (sekitar 400–600 mL) dan mengosongkannya saat berkemih.","nerve":"Parasimpatis S2–S4 (kontraksi detrusor), simpatis T10–L2 (relaksasi detrusor, penutupan leher), n. pudendus (sfingter eksternal volunter).","blood":"A. vesikalis superior dan inferior (cabang a. iliaka interna); v. vesikalis ke v. iliaka interna.","rel":"Simfisis pubis, prostat (pria) atau vagina dan uterus (wanita), rektum, ureter, uretra.","clin":"Infeksi saluran kemih (sistitis), karsinoma kandung kemih, batu kandung kemih, retensi urin, kandung kemih neurogenik."},"hypothalamus":{"desc":"Bagian diensefalon di bawah talamus yang membentuk dasar dan dinding ventral ventrikel ketiga; terhubung ke hipofisis lewat infundibulum.","fn":"Pusat integrasi saraf dan endokrin: mengatur suhu, lapar, haus, tidur, emosi, dan hormon hipofisis (releasing hormone, ADH, oksitosin).","nerve":"Hubungan dengan sistem limbik, batang otak, dan sistem saraf otonom; traktus hipotalamohipofisial ke neurohipofisis.","blood":"Lingkaran Willis (a. komunikans posterior dan anterior, a. serebri posterior); sistem portal hipotalamo-hipofisial.","rel":"Kiasma optikum, hipofisis, talamus, ventrikel ketiga, korpus mamilare.","clin":"Diabetes insipidus sentral, gangguan termoregulasi, hipopituitarisme, tumor (kraniofaringioma, glioma)."},"adenohyp":{"desc":"Lobus anterior hipofisis (sekitar 75%), berasal dari kantung Rathke; terdiri dari pars distalis, tuberalis, dan intermedia di sela tursika.","fn":"Mensekresi GH, ACTH, TSH, FSH, LH, prolaktin, dan MSH di bawah kendali hormon hipotalamus.","nerve":"Diatur hormon hipotalamus lewat sistem portal, bukan oleh serabut saraf langsung.","blood":"A. hipofisial superior (cabang a. karotis interna) melalui sistem portal hipotalamo-hipofisial.","rel":"Neurohipofisis, kiasma optikum (di atas), sinus sfenoid (di bawah), sinus kavernosus, hipotalamus.","clin":"Adenoma hipofisis (prolaktinoma tersering), akromegali, penyakit Cushing, hipopituitarisme, hemianopsia bitemporal."},"neurohyp":{"desc":"Lobus posterior hipofisis, perpanjangan saraf dari hipotalamus (pars nervosa dan infundibulum).","fn":"Menyimpan dan melepas ADH (vasopresin) dan oksitosin yang dibuat di hipotalamus.","nerve":"Akson nukleus supraoptik dan paraventrikular hipotalamus (traktus hipotalamohipofisial).","blood":"A. hipofisial inferior (cabang a. karotis interna).","rel":"Adenohipofisis, hipotalamus, tangkai hipofisis, sela tursika.","clin":"Diabetes insipidus (kurang ADH), SIADH, sindrom Sheehan."},"pineal":{"desc":"Kelenjar kecil berbentuk kerucut di garis tengah, di belakang ventrikel ketiga dekat talamus; sering mengalami kalsifikasi seiring usia.","fn":"Menghasilkan melatonin yang mengatur ritme sirkadian dan tidur-bangun.","nerve":"Simpatis dari ganglion servikal superior; terhubung ke retina lewat nukleus suprakiasmatik.","blood":"A. koroidalis posterior medial (cabang a. serebri posterior).","rel":"Talamus, kolikulus superior, ventrikel ketiga, komisura habenula dan posterior.","clin":"Tumor pineal (pinealoma, germinoma), sindrom Parinaud, gangguan tidur, kalsifikasi pineal (penanda garis tengah radiologi)."},"thyroid":{"desc":"Kelenjar berbentuk kupu-kupu di leher depan di bawah laring dengan dua lobus yang dihubungkan isthmus di depan cincin trakea 2–4.","fn":"Memproduksi tiroksin (T4) dan triiodotironin (T3) untuk metabolisme, serta kalsitonin yang menurunkan kalsium.","nerve":"Simpatis dari ganglion servikal; n. laringeus rekuren dan superior berjalan di dekatnya.","blood":"A. tiroidea superior (a. karotis eksterna) dan inferior (trunkus tirokervikalis), kadang a. tiroidea ima.","rel":"Trakea, laring, kelenjar paratiroid (di belakang), n. laringeus rekuren, a. karotis komunis.","clin":"Hipertiroidisme (Graves), hipotiroidisme (Hashimoto), goiter, nodul dan kanker tiroid, cedera n. laringeus rekuren saat tiroidektomi."},"parathyroid":{"desc":"Empat kelenjar kecil sebesar butir beras di permukaan belakang kelenjar tiroid (dua superior dan dua inferior).","fn":"Mensekresi hormon paratiroid (PTH) yang menaikkan kadar kalsium darah lewat tulang, ginjal, dan usus.","nerve":"Simpatis dari ganglion servikal; fungsi diatur umpan balik kalsium, bukan oleh saraf.","blood":"A. tiroidea inferior (terutama) dan a. tiroidea superior.","rel":"Permukaan belakang lobus tiroid, n. laringeus rekuren, esofagus, trakea.","clin":"Hiperparatiroidisme (adenoma, batu ginjal, osteoporosis), hipoparatiroidisme (hipokalsemia pasca tiroidektomi), tetani."},"adrenal":{"desc":"Sepasang kelenjar segitiga di atas kutub atas ginjal, terdiri dari korteks (zona glomerulosa, fasikulata, retikularis) dan medula.","fn":"Korteks: kortisol, aldosteron, androgen; medula: epinefrin dan norepinefrin (respons stres).","nerve":"Medula dipersarafi langsung oleh serabut simpatis preganglionik (n. splanknikus, T10–L1).","blood":"A. suprarenal superior, media, inferior (dari a. frenika inferior, aorta, a. renalis); v. suprarenalis ke v. kava inferior (kanan) atau v. renalis kiri.","rel":"Kutub atas ginjal, diafragma, hati dan v. kava inferior (kanan), pankreas dan limpa (kiri).","clin":"Sindrom Cushing, penyakit Addison, hiperaldosteronisme (sindrom Conn), feokromositoma, insufisiensi adrenal."},"thymus":{"des
